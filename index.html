  {q:'Která součást gamakamery určuje směr, ze kterého foton přiletěl?',o:['Fotonásobič','Kolimátor','Analyzátor amplitud','Světlovod'],a:1,w:'Kolimátor propustí jen fotony letící ve směru otvorů. Poloha dopadu a energie se určují jinde.'},
  {q:'Co se stane, když zvětšíme průměr otvorů kolimátoru?',o:['Zvýší se citlivost, ale zhorší rozlišení','Zlepší se rozlišení i citlivost','Zhorší se citlivost i rozlišení','Změní se jen energie fotonů'],a:0,w:'Víc fotonů projde (vyšší g), ale každý bod detektoru vidí širší sloupec těla, takže R_koll = d(L+b)/L roste.'},
  {q:'Proč se při SPECT kamera přibližuje co nejblíž k pacientovi?',o:['Aby foton měl vyšší energii','Rozlišení kolimátoru se zhoršuje lineárně se vzdáleností zdroje (R ≈ d(L+b)/L)','Aby se zvýšila hustota krystalu','Aby se zkrátil poločas'],a:1,w:'Zvětšení vzdálenosti b zhorší rozlišení kolimátoru úměrně (L+b). Vzdálený zdroj se vyobrazí rozmazaněji.'},
  {q:'Podle čeho se odliší foton rozptýlený v těle od nerozptýleného?',o:['Podle barvy světla','Podle energie: rozptýlený má nižší energii','Podle směru letu kolimátorem','Podle poločasu'],a:1,w:'Při Comptonově rozptylu foton ztratí část energie, a ta se měří v detektoru. Nízkoenergetické události se energetickým oknem vyřadí.'},
  {q:'Proč energetické okno neodstraní všechny rozptýlené fotony?',o:['Rozptýlené fotony mají vyšší energii','Foton rozptýlený pod malým úhlem ztratí málo energie a leží uvnitř okna, navíc je fotopík kvůli rozlišení detektoru široký','Okno se nedá nastavit','Rozptyl vzniká až v detektoru'],a:1,w:'Okno ±10 % propustí rozptyl do úhlu zhruba 54°. Takto rozptýlené fotony se od nerozptýlených nedají podle energie rozlišit.'},
  {q:'Co přináší detektor CZT z hlediska potlačení rozptylu?',o:['Silnější kolimátor','Užší fotopík (lepší energetické rozlišení), takže lze použít užší okno bez ztráty primárních fotonů','Vyšší energii fotonů','Pomalejší dosvit'],a:1,w:'Při užším fotopíku vyřadí užší okno víc rozptýlených fotonů, a přitom zachová většinu primárních.'},
  {q:'Proč se pro radionuklidy s vysokou energií používají kolimátory s tlustšími septy?',o:['Aby se zvýšila citlivost','Aby fotony neprošly přepážkami do sousedních otvorů (septální penetrace)','Aby se zvýšilo rozlišení krystalu','Aby kolimátor byl lehčí'],a:1,w:'Vysokoenergetické fotony pronikají olovem hlouběji. Tlustší septa omezí penetraci, ale snižují citlivost.'}
 ]
};

CONTENT.pet[3]={
 blocks:[
 `<h3>Jak PET zjistí, odkud signál přišel</h3>
  <p>PET nepoužívá kolimátor. Směr dává <b>koincidence</b>: při anihilaci vzniknou dva fotony 511 keV letící opačně, a když dva detektory zareagují <b>téměř současně</b>, anihilace proběhla na <b>přímce mezi nimi</b> (LOR). Polohu zdroje dostaneme jako průsečík mnoha takových přímek (viz Úvod a téma Softwarový dopočet).</p>
  <p>K tomu přístroj potřebuje:</p>
  <ul>
  <li><b>Prstenec detektorů</b> kolem pacienta, aby se zachytily páry fotonů ze všech směrů.</li>
  <li><b>Rychlé detektory a elektroniku</b>, která pozná, že dva zásahy proběhly v rozmezí jednotek nanosekund (<b>koincidenční okno</b>).</li>
  <li><b>Energetické okno</b>, které vyřadí fotony, jež se v těle rozptýlily a ztratily energii.</li>
  <li>U PET/CT také <b>CT</b>, které dává anatomii a mapu útlumu pro korekci (téma Softwarový dopočet).</li>
  </ul>
  <p>Ne každá koincidence ale ukazuje na správnou přímku. Rozeznáváme tři typy:</p>`,
 {w:'coinc',title:'Tři typy koincidencí',lead:'Přepínej mezi typy. Čárkovaně je přímka, kterou přístroj sestaví, červeně špatně určené detektory.'},
 `<ul>
  <li><b>Pravé (T, trues)</b>: užitečný signál.</li>
  <li><b>Rozptýlené (S, scatter)</b>: jeden nebo oba fotony se rozptýlily, přímka zdroj mine a rozmaže obraz. Část se vyřadí energetickým oknem.</li>
  <li><b>Náhodné (R, randoms)</b>: dvě nezávislé anihilace, jejichž fotony se potkaly v okně. Přímka nemá s žádným zdrojem souvislost a přidává pozadí.</li>
  </ul>
  <h3>Proč: Comptonův rozptyl a energetické okno u 511 keV</h3>
  <p>Stejně jako ve SPECT foton po rozptylu ztratí energii podle E′ = E / (1 + (E/511)(1 − cos θ)) a energetické okno ho může vyřadit. U 511 keV je to ale <b>obtížnější</b>. Rozptyl pod malým úhlem ztratí relativně málo energie a PET krystaly mají horší relativní energetické rozlišení než NaI při 140 keV (≈ 10–12 %), takže okno nesmí být úzké. Porovnej:</p>`,
 {w:'compton',k:'pet',title:'Energie po rozptylu a okno u 511 keV',lead:'Přepínej mezi 140 keV a 511 keV při stejné šířce okna. U 511 keV okno vyřadí rozptyl už od menšího úhlu.'},
 `<p>Tato situace se promítá do spektra: fotopík je široký a rozptýlené fotony zasahují do okna. Výsledkem je, že v PET zůstává v datech nezanedbatelná část rozptýlených koincidencí, a ta se musí <b>dopočítat a odečíst</b> (téma Softwarový dopočet).</p>`,
 {w:'spectrum',k:'pet',title:'Spektrum 511 keV a energetické okno',lead:'Porovnej krystaly LYSO a BGO. Horší energetické rozlišení BGO znamená širší fotopík a méně účinné oddělení rozptylu.'},
 `<h3>Náhodné koincidence a koincidenční okno</h3>
  <p>Počet náhodných koincidencí mezi dvěma detektory je <b>R = 2τ · S₁ · S₂</b>, kde S₁ a S₂ jsou četnosti jednotlivých (single) událostí v detektorech a 2τ je šířka koincidenčního okna. Dvě důležité vlastnosti:</p>
  <ul>
  <li>S₁ a S₂ jsou úměrné aktivitě, takže <b>R roste s druhou mocninou aktivity</b>, zatímco pravé koincidence T rostou jen lineárně. Při vyšší aktivitě proto podíl náhodných roste.</li>
  <li>R je úměrné <b>šířce okna</b>. Užší okno vyžaduje přesné časování, tedy rychlý krystal a fotodetektor. To je důvod, proč se v moderních přístrojích používá LYSO s dosvitem 40 ns a rychlé SiPM.</li>
  </ul>
  <p>Kvalitu dat popisuje <b>NEC</b> (noise equivalent counts): NEC = T² / (T + S + 2R). Vyjadřuje, kolik pravých koincidencí by dalo stejný poměr signál/šum, kdyby data neobsahovala rozptyl ani náhodné. Zkus změnit okno a aktivitu:</p>`,
 {w:'rand',title:'Pravé a náhodné koincidence',lead:'Změň šířku koincidenčního okna a aktivitu. Sleduj, jak rychle roste R a jak klesá NEC vůči pravým.'},
 `<h3>Time-of-flight (TOF)</h3>
  <p>Fotony letí rychlostí světla (30 cm za 1 ns). Když se přesně změří <b>rozdíl času příletu</b> obou fotonů, dá se odhadnout, v jaké části LOR anihilace proběhla: foton, který přiletěl dřív, vznikl blíž k jednomu detektoru. Nejistota polohy je <b>Δx = c · Δt / 2</b>, kde Δt je časové rozlišení koincidence. Například 400 ps odpovídá Δx ≈ 6 cm, 200 ps ≈ 3 cm.</p>
  <p>Tato informace nezlepší rozlišení obrazu, ale omezí, kam podél LOR se signál při rekonstrukci rozdělí. Šum v obraze se sníží, a to zvlášť u velkých pacientů. Pro jednoduchý případ je zisk poměru signál/šum zhruba √(D/Δx), kde D je rozměr objektu.</p>`,
 {w:'tof',title:'Poloha anihilace podél LOR',lead:'Vyber časové rozlišení a změň průměr těla. Křivka ukazuje, kde podél přímky TOF umístí anihilaci.'},
 `<p>Časové rozlišení záleží na <b>rychlosti krystalu</b> (světelný výtěžek a dosvit, téma Detekce) a na <b>fotodetektoru</b>. SiPM mají lepší časování než fotonásobiče, proto mají novější přístroje TOF kolem 200–300 ps a starší 400–550 ps.</p>
  <h3>Prostorové rozlišení a jak ho zlepšit</h3>
  <p>Rozlišení PET určují čtyři příspěvky, které se sčítají geometricky:</p>
  <ul>
  <li><b>Šířka krystalu d</b>: příspěvek d/2. Menší krystaly, ale víc jich je třeba.</li>
  <li><b>Dosah pozitronu</b>: anihilace proběhne mimo místo rozpadu (téma Zdroj signálu). Příspěvek je největší u Rb-82 a Ga-68, nejmenší u F-18.</li>
  <li><b>Nekolinearita</b>: fotony nelétí přesně opačně, ale pod úhlem 180° ± 0,25°. Příspěvek roste s průměrem prstence: 0,0022 · D (u prstence 83 cm ≈ 1,8 mm).</li>
  <li><b>Určení zasaženého krystalu</b> v bloku (téma Detekce) a další vlivy.</li>
  </ul>
  <p>Výsledek je zhruba <b>R ≈ 1,25 · √((d/2)² + s² + (0,0022 D)² + b²)</b>. Vyzkoušej, co dominuje:</p>`,
 {w:'petres',title:'Rozpočet rozlišení PET',lead:'Změň krystal, nuklid a průměr prstence. Pruhy ukazují jednotlivé příspěvky.'},
 `<h3>Z čeho se skládá přístroj a co dělá</h3>
  <ul>
  <li><b>Prstenec bloků</b> (krystaly a fotodetektory): měří polohu zásahu, energii a čas.</li>
  <li><b>Koincidenční jednotka</b>: páruje události z různých bloků v koincidenčním okně.</li>
  <li><b>Energetické okno</b>: vyřazuje část rozptýlených fotonů.</li>
  <li><b>Časování</b> (u TOF přístrojů): zapisuje rozdíl času příletu.</li>
  <li><b>CT</b> v PET/CT: dává anatomii a mapu útlumu.</li>
  </ul>
  <h3>Jak lokalizaci zlepšit</h3>
  <ul>
  <li><b>Menší krystaly</b> a přesné určení zasaženého krystalu (SiPM umožňují číst krystaly po jednom).</li>
  <li><b>Rychlé krystaly a fotodetektory</b> pro lepší TOF a užší koincidenční okno.</li>
  <li><b>Nuklid s krátkým dosahem pozitronu</b> (např. F-18).</li>
  <li><b>Menší průměr prstence</b> snižuje nekolinearitu, a zároveň zvyšuje citlivost.</li>
  <li><b>Dostatek událostí</b> (déle nebo s vyšší aktivitou) proti šumu, ale ne tak, aby rostly náhodné.</li>
  <li>Korekce rozptylu, náhodných koincidencí a útlumu při rekonstrukci (téma Softwarový dopočet).</li>
  </ul>`,
 {gloss:1}
 ],
 src:`Typy koincidencí, vzorec R = 2τ·S₁·S₂, NECR = T²/(T + S + 2R), vzorec pro rozlišení PET včetně hodnot dosahu pozitronu (F-18 0,54 mm, Ga-68 1,35 mm, Rb-82 2,60 mm), nekolinearita 0,0022·D, TOF Δx = c·Δt/2 a zisk √(D/Δx), mezní úhel rozptylu při 511 keV a okně ±15 % (≈ 34°): <a href="https://socr.umich.edu/BPAD1/BPAD1_notes/BPAD1_Chap06_NuclearMedicine_PET_SPECT.html" target="_blank" rel="noopener">SOCR, učební poznámky k PET a SPECT, kap. 6.5–6.6</a>. Časové rozlišení komerčních TOF přístrojů (400–550 ps starší, Vereos ≈ 310 ps) a vztah Δx = c·Δt/2: <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4747834" target="_blank" rel="noopener">přehled časového rozlišení v TOF PET (PMC4747834)</a>. Konstanty v grafu náhodných koincidencí jsou ilustrační. Typická šířka koincidenčního okna je údaj, který je třeba doložit v dokumentaci výrobce.`,
 quiz:[
  {q:'Co je u PET pravá koincidence?',o:['Zásah dvou fotonů z různých anihilací','Oba fotony z jedné anihilace zachycené bez rozptylu, přímka mezi detektory prochází zdrojem','Jeden foton zachycený dvěma detektory','Foton rozptýlený v těle'],a:1,w:'Jen pravé koincidence nesou správnou informaci o poloze. Rozptýlené a náhodné vedou k chybným přímkám.'},
  {q:'Čím se liší náhodná koincidence od rozptýlené?',o:['Rozptýlená vzniká z jedné anihilace, jejíž foton změnil směr, náhodná ze dvou různých anihilací','Náhodná má vyšší energii','Rozptýlená vzniká v krystalu','Nijak'],a:0,w:'U rozptýlené existuje zdroj, ale přímka je chybná. U náhodné nemá přímka se zdrojem žádnou souvislost, protože fotony pocházejí z různých anihilací.'},
  {q:'Proč náhodné koincidence rostou rychleji než pravé, když se zvyšuje aktivita?',o:['Protože se zkracuje poločas','R = 2τ·S₁·S₂ a singles S jsou úměrné aktivitě, takže R roste s druhou mocninou, T jen lineárně','Protože se zvětšuje energie fotonů','Protože se zvyšuje počet krystalů'],a:1,w:'Dvojnásobná aktivita znamená dvojnásobné S₁ i S₂, tedy čtyřnásobné R, ale jen dvojnásobné T.'},
  {q:'Jak lze snížit počet náhodných koincidencí při stejné aktivitě?',o:['Zkrátit koincidenční okno, což vyžaduje rychlý krystal a elektroniku','Prodloužit koincidenční okno','Zvětšit krystaly','Použít kolimátor'],a:0,w:'R je úměrné šířce okna. Užší okno však vyžaduje přesné časování, proto se používá rychlý LYSO a SiPM.'},
  {q:'Jakou nejistotu polohy podél LOR dává časové rozlišení 400 ps?',o:['≈ 6 cm','≈ 6 mm','≈ 60 cm','≈ 0,6 mm'],a:0,w:'Δx = c·Δt/2 = 0,03 cm/ps · 400 ps / 2 ≈ 6 cm.'},
  {q:'Co TOF zlepší?',o:['Přímo prostorové rozlišení o řád','Poměr signálu k šumu, protože signál se rozdělí jen do kratšího úseku LOR','Dosah pozitronu','Energetické rozlišení krystalu'],a:1,w:'TOF omezí, kam podél LOR se signál při rekonstrukci rozdělí. Obraz je méně zašuměný, zvlášť u velkých pacientů. Rozlišení přímo nezmění.'},
  {q:'Které příspěvky omezují prostorové rozlišení PET?',o:['Šířka krystalu, dosah pozitronu, nekolinearita a určení zasaženého krystalu','Jen dosah pozitronu','Jen velikost prstence','Jen barva světla scintilátoru'],a:0,w:'Všechny čtyři se skládají geometricky. Klinický F-18 PET je omezen hlavně šířkou krystalu a nekolinearitou, u Ga-68 a Rb-82 roste vliv dosahu pozitronu.'}
 ]

/* ---------- Schéma: odkud záření přichází ---------- */
function mountEmis(host){
  var mode=0;
  host.innerHTML='<div class="chips" role="group" aria-label="Typ zobrazení">'+
    ['RTG / CT: zdroj mimo tělo','SPECT / PET: zdroj v těle'].map(function(t,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===0)+'">'+t+'</button>'}).join('')+
    '</div><svg class="chart" viewBox="0 0 560 250" role="img" aria-label="Schéma transmisního a emisního zobrazení"></svg><p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), rd=$('.read',host);
  function draw(){
    var s='';
    if(mode===0){
      s+='<ellipse class="body" cx="280" cy="112" rx="125" ry="84"/><circle class="organ" cx="285" cy="112" r="26"/>';
      s+='<rect class="dev" x="30" y="92" width="36" height="40" rx="4"/><text x="48" y="150" text-anchor="middle">zdroj</text><text class="sub" x="48" y="166" text-anchor="middle">(rentgenka)</text>';
      [52,82,112,142,172].forEach(function(y){
        var through=Math.abs(112+(y-112)*0.524-112)<26;
        s+='<line class="ray" style="opacity:'+(through?0.3:0.9)+'" x1="66" y1="112" x2="484" y2="'+y+'"/>';
      });
      s+='<rect class="dev" x="486" y="22" width="16" height="180" rx="3"/><text x="494" y="222" text-anchor="middle">detektor</text>';
      rd.innerHTML='Záření prochází tělem. Detektor měří, <b>kolik ho cestou zmizelo</b> (hustší tkáň více pohlcuje, vzniká „stín“). Obraz ukazuje <b>stavbu</b> těla.';
    }else{
      s+='<ellipse class="ringe" cx="280" cy="112" rx="200" ry="100"/>';
      for(var i=0;i<24;i++){var a=i*Math.PI/12; s+='<line class="xtal" x1="'+(280+200*Math.cos(a)).toFixed(1)+'" y1="'+(112+100*Math.sin(a)).toFixed(1)+'" x2="'+(280+211*Math.cos(a)).toFixed(1)+'" y2="'+(112+109*Math.sin(a)).toFixed(1)+'"/>'}
      s+='<ellipse class="body" cx="280" cy="112" rx="100" ry="62"/>';
      var src=[[250,100],[305,128],[282,92]], angs=[0.3,1.5,2.7,3.9,5.2];
      src.forEach(function(p,j){
        angs.forEach(function(a){var t=a+j*0.45; s+='<line class="ray" style="opacity:.55" x1="'+p[0]+'" y1="'+p[1]+'" x2="'+(280+200*Math.cos(t)).toFixed(1)+'" y2="'+(112+100*Math.sin(t)).toFixed(1)+'"/>'});
      });
      src.forEach(function(p){s+='<circle class="src" cx="'+p[0]+'" cy="'+p[1]+'" r="5"/>'});
      s+='<text x="280" y="244" text-anchor="middle">detektory kolem těla · zdroje uvnitř těla</text>';
      rd.innerHTML='Radioaktivní látka je v těle a záření z ní vychází ven. Detektory kolem těla zjišťují, <b>odkud a kolik</b> ho přichází. Obraz ukazuje <b>funkci</b>: kde se látka nahromadila.';
    }
    svg.innerHTML=s;
  }
  host.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    mode=+b.dataset.i;
    host.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b))});
    draw();
  });
  draw();
}

/* ---------- Grafy rozpadu ---------- */
function mountDecay(host,key){
  var list=ISO[key], i=0, f=0.2, id='d'+(++uid);
  host.innerHTML='<div class="chips" role="group" aria-label="Radionuklid">'+
    list.map(function(o,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===0)+'">'+o.n+'</button>'}).join('')+
    '</div><svg class="chart" viewBox="0 0 560 282" role="img" aria-label="Exponenciální pokles aktivity v čase"></svg>'+
    '<label class="sl" for="'+id+'">Čas od kalibrace<input id="'+id+'" type="range" min="0" max="1000" value="200"></label>'+
    '<p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), rd=$('.read',host), sl=$('input',host);
  function draw(){
    var o=list[i], T=o.t*5, L=48, R=520, Tp=18, B=232;
    var X=function(t){return L+(R-L)*t/T}, Y=function(a){return B-(B-Tp)*a/100};
    var s='';
    [100,50,25,12.5].forEach(function(a){
      s+='<line class="grid" x1="'+L+'" x2="'+R+'" y1="'+Y(a)+'" y2="'+Y(a)+'"/><text x="'+(L-8)+'" y="'+(Y(a)+4)+'" text-anchor="end">'+nf(a,1)+'</text>';
    });
    s+='<text x="'+L+'" y="10" text-anchor="start" class="sub">aktivita [%]</text>';
    for(var k=0;k<=5;k++){
      var x=X(k*o.t);
      s+='<line class="tick" x1="'+x+'" x2="'+x+'" y1="'+B+'" y2="'+(B+5)+'"/><text x="'+x+'" y="'+(B+21)+'" text-anchor="middle">'+fmtT(k*o.t)+'</text><text class="sub" x="'+x+'" y="'+(B+37)+'" text-anchor="middle">'+k+' T½</text>';
    }
    var p='';
    for(var n=0;n<=120;n++){var t=T*n/120;p+=(n?'L':'M')+X(t).toFixed(1)+' '+Y(100*Math.pow(2,-t/o.t)).toFixed(1)+' '}
    s+='<path class="curve" d="'+p+'"/>';
    var tt=f*T, a=100*Math.pow(2,-tt/o.t), mx=X(tt), my=Y(a);
    s+='<line class="vl" x1="'+mx+'" x2="'+mx+'" y1="'+Tp+'" y2="'+B+'"/><circle class="mk" cx="'+mx+'" cy="'+my+'" r="6"/>';
    s+='<text class="lab" x="'+(mx>R-70?mx-10:mx+10)+'" y="'+(my-10)+'" text-anchor="'+(mx>R-70?'end':'start')+'">'+nf(a,1)+' %</text>';
    svg.innerHTML=s;

/* ---------- Kolimátor ---------- */
function mountCollim(host){
  var on=true, sv=0.55, id='c'+(++uid), hist=[], nb=1, emitted=0, acc=0, traces=[], raf=0, G={};
  host.innerHTML='<div class="chips" role="group" aria-label="Kolimátor">'+
    ['Bez kolimátoru','S kolimátorem'].map(function(t,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===1)+'">'+t+'</button>'}).join('')+
    '</div><canvas class="cv" role="img" aria-label="Dva zdroje v těle vysílají fotony do všech směrů. S kolimátorem dopadají na detektor jen fotony letící téměř kolmo a histogram má dva ostré píky."></canvas>'+
    '<label class="sl" for="'+id+'">Délka otvorů kolimátoru (delší otvory = ostřejší obraz, méně fotonů)<input id="'+id+'" type="range" min="0" max="100" value="55"></label>'+
    '<button type="button" class="btn">Vyslat další fotony</button><p class="read" aria-live="polite"></p>';
  var cv=$('canvas',host), ctx=cv.getContext('2d'), rd=$('.read',host), sl=$('input',host);
  function size(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
  function geo(){
    var w=cv.clientWidth,h=cv.clientHeight,d=0.02*w,L=0.05*w+(0.22*w-0.05*w)*sv;
    G={w:w,h:h,xs:0.2*w,ys:[h/2-0.14*h,h/2+0.12*h],xd:0.64*w,d:d,L:L,alpha:Math.atan(d/L)};
    nb=Math.max(1,Math.floor((h-16)/3));
  }
  function emit(n,trace){
    for(var i=0;i<n;i++){
      var si=Math.random()<0.5?0:1, th=(Math.random()*2-1)*Math.PI; emitted++;
      if(Math.cos(th)<=0) continue;
      var tn=Math.tan(th), y0=G.ys[si], yh=y0+(G.xd-G.xs)*tn;
      var pass=on?Math.abs(tn)<G.d/G.L:true, inr=yh>=8&&yh<=G.h-8;
      if(pass&&inr){
        acc++; var b=Math.min(nb-1,Math.floor((yh-8)/3)); hist[b]=(hist[b]||0)+1;
        if(trace) traces.push({x0:G.xs,y0:y0,x1:G.xd,y1:yh,ok:1,a:0});
      }else if(trace&&on&&!pass){
        var xe=G.xd-G.L-2, ye=y0+(xe-G.xs)*tn;
        if(ye>4&&ye<G.h-4) traces.push({x0:G.xs,y0:y0,x1:xe,y1:ye,ok:0,a:0});
      }
    }
  }
  function draw(){
    var w=G.w,h=G.h; ctx.clearRect(0,0,w,h);
    var cs=getComputedStyle(cv), C=function(n){return cs.getPropertyValue(n).trim()};
    var fg=C('--fg'), mu=C('--muted'), ln=C('--line'), ac=C('--accent');
    ctx.strokeStyle=ln; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(0.2*w,h/2,0.17*w,0.4*h,0,0,Math.PI*2); ctx.stroke();
    traces.forEach(function(t){
      ctx.globalAlpha=Math.max(0,1-t.a/16)*(t.ok?0.8:0.5); ctx.strokeStyle=t.ok?ac:mu; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(t.x0,t.y0); ctx.lineTo(t.x1,t.y1); ctx.stroke();
    });
    ctx.globalAlpha=1;
    if(on){
      var xc=G.xd-G.L-2, p=G.d+2; ctx.fillStyle=mu; ctx.globalAlpha=.8;
      for(var y=8;y<h-8;y+=p) ctx.fillRect(xc,y,G.L,2);
      ctx.globalAlpha=1; ctx.font='12px JetBrains Mono, monospace'; ctx.textAlign='center'; ctx.fillStyle=mu; ctx.fillText('kolimátor',xc+G.L/2,h-0-2>8?12:12);
    }
    ctx.fillStyle=fg; ctx.fillRect(G.xd,8,4,h-16);
    var mx=1; for(var b=0;b<nb;b++) if((hist[b]||0)>mx) mx=hist[b];
    var bx=G.xd+9, bw=w-bx-8; ctx.fillStyle=ac; ctx.globalAlpha=.85;
    for(var b2=0;b2<nb;b2++) ctx.fillRect(bx,8+b2*3,bw*(hist[b2]||0)/mx,3);
    ctx.globalAlpha=1;
    G.ys.forEach(function(y){ctx.fillStyle=ac;ctx.beginPath();ctx.arc(G.xs,y,6,0,Math.PI*2);ctx.fill()});
    ctx.font='12px Inter, sans-serif'; ctx.fillStyle=mu; ctx.textAlign='center';
    ctx.fillText('zdroje v těle',0.2*w,h-6); ctx.fillText('detektor',G.xd+2,h-6);
    ctx.textAlign='left'; ctx.fillText('počet fotonů',bx,h-6>20?h-6:h-6);
    var deg=G.alpha*180/Math.PI;
    rd.innerHTML=on?
      'Z '+emitted+' vyslaných fotonů dopadlo na detektor <b>'+acc+' ('+nf(100*acc/emitted,1)+' %)</b>. Úhel přijetí kolimátoru je asi ±'+nf(deg,1)+'°.<br><span class="muted">Zjednodušený 2D model. Ve skutečném 3D kolimátoru je zachyceno řádově jen 0,01 % emitovaných fotonů.</span>':
      'Z '+emitted+' vyslaných fotonů dopadlo na detektor <b>'+acc+' ('+nf(100*acc/emitted,1)+' %)</b>, ale z každého zdroje na všechna místa. Histogram je rozmazaná vlna a zdroje nerozlišíš.';
  }
  function reset(){
    geo(); hist=[]; for(var i=0;i<nb;i++) hist[i]=0; emitted=0; acc=0; traces=[]; emit(3000,false); draw();
  }
  function burst(){
    clearTimeout(raf);
    if(reduce){emit(400,false);draw();return}
    var f=0, loop=function(){
      if(f<24) emit(25,true);
      draw();
      traces.forEach(function(t){t.a++}); traces=traces.filter(function(t){return t.a<16});
      f++; if(f<24||traces.length) raf=rafT(loop); else draw();
    };
    raf=rafT(loop);
  }
  host.addEventListener('click',function(e){
    var b=e.target.closest('.chip');
    if(b){on=+b.dataset.i===1; host.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b))}); sl.disabled=!on; reset(); return}
    if(e.target.closest('.btn')) burst();
  });
  sl.addEventListener('input',function(){sv=sl.value/100;reset()});
  var again=function(){size();reset()};
  redrawers.push(function(){draw()});
  if('ResizeObserver' in window) new ResizeObserver(again).observe(cv);
  size(); reset();
}

/* ---------- Rekonstrukce z pohledů ---------- */
function mountRecon(host,key){
  var N=64, NB=96, CN=NB/2-0.5, VIEWS=[1,2,3,4,6,8,12,16,24,32,48,64], vi=7, filt=false, id='r'+(++uid);
  var phantom=new Float32Array(N*N);
  for(var y=0;y<N;y++){for(var x=0;x<N;x++){
    var X=x-31.5, Y=y-31.5, v=0;
    if(X*X/(26*26)+Y*Y/(22*22)<=1) v=0.12;
    if((x-24)*(x-24)+(y-26)*(y-26)<=25) v=1;
    if((x-40)*(x-40)+(y-30)*(y-30)<=12.25) v=0.8;
    if((x-30)*(x-30)+(y-41)*(y-41)<=16) v=0.55;
    if((x-38)*(x-38)+(y-40)*(y-40)<=9) v=0;
    phantom[y*N+x]=v;
  }}
  host.innerHTML='<div class="trio">'+
    '<figure><canvas width="64" height="64" aria-label="Skutečné rozložení látky"></canvas><figcaption>skutečné rozložení</figcaption></figure>'+
    '<figure><canvas width="96" height="64" aria-label="Sinogram, změřená data"></canvas><figcaption>změřená data (sinogram)</figcaption></figure>'+
    '<figure><canvas width="64" height="64" aria-label="Rekonstruovaný obraz"></canvas><figcaption>rekonstrukce</figcaption></figure></div>'+
    '<label class="sl" for="'+id+'">Počet pohledů (úhlů)<input id="'+id+'" type="range" min="0" max="'+(VIEWS.length-1)+'" step="1" value="'+vi+'"></label>'+
    '<div class="chips"><button type="button" class="chip" aria-pressed="false">Filtr: vypnuto</button></div><p class="read" aria-live="polite"></p>';
  var cvs=host.querySelectorAll('canvas'), sl=$('input',host), chip=$('.chip',host), rd=$('.read',host);
  function cmap(v,ac){
    v=Math.max(0,Math.min(1,v)); var r,g,b;
    if(v<0.6){var t=v/0.6;r=ac[0]*t;g=ac[1]*t;b=ac[2]*t}
    else{var u=(v-0.6)/0.4;r=ac[0]+(255-ac[0])*u;g=ac[1]+(255-ac[1])*u;b=ac[2]+(255-ac[2])*u}
    return [r,g,b];
  }
  function paint(cv,w,h,fn,ac){
    var c=cv.getContext('2d'), im=c.createImageData(w,h);
    for(var yy=0;yy<h;yy++)for(var xx=0;xx<w;xx++){var col=cmap(fn(xx,yy),ac), o=(yy*w+xx)*4; im.data[o]=col[0];im.data[o+1]=col[1];im.data[o+2]=col[2];im.data[o+3]=255}
    c.putImageData(im,0,0);
  }
  function draw(){
    var n=VIEWS[vi], ac=rgb(getComputedStyle(host).getPropertyValue('--accent'));
    var cs=[],sn=[],P=[],maxp=0,k,b;
    for(k=0;k<n;k++){cs.push(Math.cos(Math.PI*k/n));sn.push(Math.sin(Math.PI*k/n))}
    for(k=0;k<n;k++){
      var p=new Float32Array(NB);
      for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++){
        var v=phantom[yy*N+xx]; if(!v) continue;
        var pos=(xx-31.5)*cs[k]+(yy-31.5)*sn[k]+CN, i0=Math.floor(pos), fr=pos-i0;
        p[i0]+=v*(1-fr); p[i0+1]+=v*fr;
      }
      for(b=0;b<NB;b++) if(p[b]>maxp) maxp=p[b];
      P.push(p);
    }
    var Q=P;
    if(filt){
      Q=P.map(function(p){
        var q=new Float32Array(NB);
        for(var bb=0;bb<NB;bb++){
          var sum=0;
          for(var m=-(NB-1);m<=NB-1;m++){
            var j=bb-m; if(j<0||j>=NB) continue;
            var hk=m===0?0.25:((m&1)?-1/(Math.PI*Math.PI*m*m):0);
            sum+=hk*p[j];
          }
          q[bb]=sum;
        }
        return q;
      });
    }
    var img=new Float32Array(N*N), mx=1e-9;
    for(var y2=0;y2<N;y2++)for(var x2=0;x2<N;x2++){
      var a=0;
      for(var k2=0;k2<n;k2++){
        var pos2=(x2-31.5)*cs[k2]+(y2-31.5)*sn[k2]+CN, j0=Math.floor(pos2), ff=pos2-j0;
        a+=Q[k2][j0]*(1-ff)+Q[k2][j0+1]*ff;
      }
      a*=Math.PI/n; if(a<0) a=0; img[y2*N+x2]=a; if(a>mx) mx=a;
    }
    paint(cvs[0],N,N,function(x,y){return phantom[y*N+x]},ac);
    paint(cvs[1],NB,64,function(x,y){
      var kk=Math.floor(y*n/64); if(kk>=n) return 0;
      return P[kk][x]/(maxp||1);
    },ac);
    paint(cvs[2],N,N,function(x,y){return img[y*N+x]/mx},ac);
    var msg=filt?'Filtr zvýrazní ostré hrany a odstraní rozmazání, které zbývá po prosté zpětné projekci.':'Bez filtru se každý pohled rozetře zpět přes celý obraz, a proto kolem zdrojů zůstává rozmazání (hvězdicovité paprsky).';
    rd.innerHTML='<b>'+n+' '+pl(n)+'.</b> '+(n<4?'S tak málo pohledy se zdroje jen rozmažou do pruhů a polohu v hloubce neznáme. ':n<16?'Zdroje se začínají oddělovat, ale kolem nich zůstávají artefakty. ':'Zdroje jsou dobře oddělené. ')+msg+'<br><span class="muted">Skutečný SPECT snímá typicky desítky až kolem stovky úhlů.</span>';
  }
  sl.addEventListener('input',function(){vi=+sl.value;draw()});
  chip.addEventListener('click',function(){filt=!filt;chip.setAttribute('aria-pressed',String(filt));chip.textContent='Filtr: '+(filt?'zapnuto':'vypnuto');draw()});
  redrawers.push(draw);
  draw();
}

/* ---------- LOR ---------- */
function mountLor(host){
  var id='l'+(++uid), MAXN=1600, ev=[], r=rng(11), N=60;
  for(var i=0;i<MAXN;i++){ev.push({s:r()<0.62?0:1,a:r()*Math.PI*2})}
  host.innerHTML='<canvas class="cv" role="img" aria-label="Přímky koincidence se s rostoucím počtem událostí protínají v místech dvou zdrojů"></canvas>'+
    '<label class="sl" for="'+id+'">Počet zachycených událostí<input id="'+id+'" type="range" min="0" max="1000" value="330"></label><p class="read" aria-live="polite"></p>';
  var cv=$('canvas',host), ctx=cv.getContext('2d'), sl=$('input',host), rd=$('.read',host);
  function size(){var rr=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(rr.width*d);cv.height=Math.round(rr.height*d);ctx.setTransform(d,0,0,d,0,0)}
  function draw(){
    var w=cv.clientWidth,h=cv.clientHeight; ctx.clearRect(0,0,w,h);
    var cs=getComputedStyle(cv), C=function(n){return cs.getPropertyValue(n).trim()};
    var fg=C('--fg'), mu=C('--muted'), ln=C('--line'), ac=C('--accent');
    var G=Math.min(w,h)/2-16; ctx.save(); ctx.translate(w/2,h/2);
    ctx.strokeStyle=ln; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,G,0,Math.PI*2); ctx.stroke();
    var NC=48; ctx.lineWidth=9; ctx.strokeStyle=mu; ctx.globalAlpha=.3;
    for(var i=0;i<NC;i++){ctx.beginPath();ctx.arc(0,0,G+6,i*2*Math.PI/NC+.02,(i+1)*2*Math.PI/NC-.02);ctx.stroke()}
    var S=[{x:-0.30*G,y:-0.14*G},{x:0.28*G,y:0.18*G}];
    ctx.strokeStyle=ac; ctx.globalAlpha=N<25?0.7:Math.min(0.5,Math.max(0.035,1.6/Math.sqrt(N))); ctx.lineWidth=1;

    rd.innerHTML='Zobrazeno <b>'+N+'</b> přímek koincidence (LOR). '+(N<30?'Zatím je to jen svazek čar a polohu zdrojů nepoznáš.':N<300?'Přímky se začínají protínat v místech zdrojů, obraz je ještě zrnitý (šum).':'Průsečíky jsou jasně vidět. Čím víc událostí, tím menší šum.')+'<br><span class="muted">Slabší zdroj (pravý dole) vydává méně událostí, proto je vidět později.</span>';
  }
  sl.addEventListener('input',function(){N=Math.max(2,Math.round(2*Math.pow(10,sl.value/1000*2.9)));draw()});
  N=Math.max(2,Math.round(2*Math.pow(10,330/1000*2.9)));

/* ---------- Pomocné ---------- */
function sci(x){
  if(!isFinite(x)||x===0) return '0';
  var e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e);
  if(e>-3&&e<6) return nf(x,e<0?-e+1:(e<2?1:0));
  return nf(m,1)+' × 10<sup>'+(e<0?'−'+(-e):e)+'</sup>';
}
function randn(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function poisson(l){
  if(l<=0) return 0;
  if(l>30) return Math.max(0,Math.round(l+Math.sqrt(l)*randn()));
  var L=Math.exp(-l),k=0,p=1; do{k++;p*=Math.random()}while(p>L); return k-1;
}

function mountLocate(host,key){

  var sig=pet?40:16, rad=pet?26:16, SC=2.8, OX=10, OY=10, G=8, cell=12.5;
  var N=pet?600:900, pt=pet?{x:(5+.5)*cell,y:(2+.5)*cell}:{x:30,y:62}, last=null, cloud=[], cal=[], acc=null;
  function weights(x,y){var w=P.map(function(p){var dx=x-p[0],dy=y-p[1];return Math.exp(-(dx*dx+dy*dy)/(2*sig*sig))});var s=w.reduce(function(a,b){return a+b},0);return w.map(function(v){return v/s})}

  function decode(e){var b=0,bd=1e9;for(var k=0;k<cal.length;k++){var dx=e.x-cal[k].x,dy=e.y-cal[k].y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=k}}return cal[b]}
  host.innerHTML='<svg class="chart" viewBox="0 0 560 300" role="img" aria-label="Krystal s fotonásobiči: klikni na místo záblesku" style="cursor:crosshair;touch-action:manipulation"></svg>'+
    '<label class="sl" for="'+id+'">Počet fotoelektronů v záblesku: <b class="vn"></b><input id="'+id+'" type="range" min="0" max="1000" value="0"></label>'+
    '<button type="button" class="btn">Vyslat 100 událostí</button><p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), rd=$('.read',host), sl=$('input',host), vn=$('.vn',host);

    var s='', X=function(u){return OX+u*SC}, Y=function(u){return OY+u*SC}, true_=last?last.true_:null;
    s+='<rect x="'+OX+'" y="'+OY+'" width="'+(100*SC)+'" height="'+(100*SC)+'" rx="4" style="fill:var(--bg);stroke:var(--line);stroke-width:2"/>';
    if(pet){for(var g=1;g<G;g++){s+='<line class="grid" x1="'+X(g*cell)+'" x2="'+X(g*cell)+'" y1="'+Y(0)+'" y2="'+Y(100)+'"/><line class="grid" y1="'+Y(g*cell)+'" y2="'+Y(g*cell)+'" x1="'+X(0)+'" x2="'+X(100)+'"/>'}}
    var sg=last?last.s:null, mx=1;

      s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="'+(rad*SC)+'" style="fill:var(--accent);fill-opacity:'+op.toFixed(2)+';stroke:var(--accent);stroke-opacity:.5;stroke-dasharray:4 4"/>';
      s+='<text x="'+X(p[0])+'" y="'+(Y(p[1])+4)+'" text-anchor="middle" style="font-size:11px">'+(i+1)+'</text>';
    });
    if(pet){cal.forEach(function(c){s+='<circle cx="'+X(c.x)+'" cy="'+Y(c.y)+'" r="2.5" style="fill:var(--muted)" opacity=".7"/>'})}
    cloud.forEach(function(c){s+='<circle cx="'+X(c.x)+'" cy="'+Y(c.y)+'" r="2.2" style="fill:var(--accent)" opacity=".45"/>'});
    s+='<circle class="mk" cx="'+X(pt.x)+'" cy="'+Y(pt.y)+'" r="6"/>';
    if(last){s+='<line x1="'+X(pt.x)+'" y1="'+Y(pt.y)+'" x2="'+X(last.est.x)+'" y2="'+Y(last.est.y)+'" style="stroke:var(--fg);stroke-width:1.5;stroke-dasharray:3 3"/>'+
      '<path d="M'+(X(last.est.x)-6)+' '+(Y(last.est.y)-6)+'L'+(X(last.est.x)+6)+' '+(Y(last.est.y)+6)+'M'+(X(last.est.x)+6)+' '+(Y(last.est.y)-6)+'L'+(X(last.est.x)-6)+' '+(Y(last.est.y)+6)+'" style="stroke:var(--fg);stroke-width:2.5;fill:none"/>'}
    if(pet&&last&&last.dec){var d=last.dec;s+='<rect x="'+X(d.i*cell)+'" y="'+Y(d.j*cell)+'" width="'+(cell*SC)+'" height="'+(cell*SC)+'" style="fill:none;stroke:'+(last.ok?'var(--ok)':'var(--bad)')+';stroke-width:3"/>'}

/* ---------- Spektrum a energetické okno ---------- */
function mountSpectrum(host,key){
  var pet=key==='pet', E=pet?511:140, rho=pet?0.4:0.5, id='sp'+(++uid), sel=0, w=pet?15:10;
  var OPT=pet?[{n:'LYSO (≈ 10 %)',er:10},{n:'BGO (≈ 12 %)',er:12}]:[{n:'NaI(Tl) (≈ 9,5 %)',er:9.5},{n:'CZT (≈ 5,5 %)',er:5.5}];
  var emin=E/(1+2*E/511), NG=240, x0=0.45*E, x1=1.25*E, dx=(x1-x0)/NG;
  function model(er){
    var sg=er/100*E/2.355, pk=[], sc=[], tot=[], i, j, e;
    var ramp=function(v){return v>=emin&&v<=E?(v-emin)/(E-emin):0}, norm=rho/((E-emin)/2);
    for(i=0;i<=NG;i++){
      e=x0+i*dx; pk.push(Math.exp(-(e-E)*(e-E)/(2*sg*sg))/(sg*Math.sqrt(2*Math.PI)));
      var a=0; for(j=0;j<=NG*2;j++){var ep=emin+(E-emin)*j/(NG*2); a+=ramp(ep)*Math.exp(-(e-ep)*(e-ep)/(2*sg*sg))/(sg*Math.sqrt(2*Math.PI))}
      sc.push(a*norm*(E-emin)/(NG*2));
    }
    return {pk:pk,sc:sc};
  }
  var M=OPT.map(function(o){return model(o.er)});
  host.innerHTML='<div class="chips" role="group" aria-label="Detektor">'+OPT.map(function(o,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===0)+'">'+o.n+'</button>'}).join('')+'</div>'+
    '<svg class="chart" viewBox="0 0 560 270" role="img" aria-label="Energetické spektrum s fotopíkem a rozptýlenými fotony a energetickým oknem"></svg>'+
    '<label class="sl" for="'+id+'">Polovina šířky okna: ± <b class="vw"></b><input id="'+id+'" type="range" min="3" max="30" step="1" value="'+w+'"></label>'+
    '<div class="tbl"><table class="st"></table></div><p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), sl=$('input',host), tb=$('.st',host), rd=$('.read',host);
  function win(m){
    var lo=E*(1-w/100), hi=E*(1+w/100), p=0, s=0;
    for(var i=0;i<=NG;i++){var e=x0+i*dx; if(e>=lo&&e<=hi){p+=m.pk[i]*dx;s+=m.sc[i]*dx}}
    return {p:p,s:s};
  }
  function draw(){
    var Lf=48,R=530,Tp=18,B=222, X=function(e){return Lf+(R-Lf)*(e-x0)/(x1-x0)};
    var m=M[sel], mx=0, i;
    for(i=0;i<=NG;i++){var tv=m.pk[i]+m.sc[i];if(tv>mx)mx=tv}
    var Y=function(v){return B-(B-Tp-8)*v/mx};
    var s='';
    var step=pet?100:20;
    for(var e=Math.ceil(x0/step)*step;e<=x1;e+=step){s+='<line class="tick" x1="'+X(e)+'" x2="'+X(e)+'" y1="'+B+'" y2="'+(B+5)+'"/><text x="'+X(e)+'" y="'+(B+21)+'" text-anchor="middle">'+e+'</text>'}
    s+='<line class="grid" x1="'+Lf+'" x2="'+R+'" y1="'+B+'" y2="'+B+'"/><text class="sub" x="'+R+'" y="'+(B+36)+'" text-anchor="end">energie [keV]</text><text class="sub" x="'+Lf+'" y="10">počet zaznamenaných fotonů</text>';
    var lo=E*(1-w/100), hi=E*(1+w/100);
    s+='<rect x="'+X(lo)+'" y="'+(Tp)+'" width="'+(X(hi)-X(lo))+'" height="'+(B-Tp)+'" style="fill:var(--accent);fill-opacity:.12"/><line class="vl" x1="'+X(lo)+'" x2="'+X(lo)+'" y1="'+Tp+'" y2="'+B+'"/><line class="vl" x1="'+X(hi)+'" x2="'+X(hi)+'" y1="'+Tp+'" y2="'+B+'"/>';
    var p='',q='',r='';
    for(i=0;i<=NG;i++){var ee=x0+i*dx; p+=(i?'L':'M')+X(ee).toFixed(1)+' '+Y(m.pk[i]+m.sc[i]).toFixed(1)+' '; q+=(i?'L':'M')+X(ee).toFixed(1)+' '+Y(m.sc[i]).toFixed(1)+' '}
    s+='<path class="curve2" d="'+q+'"/><path class="curve" d="'+p+'"/>';
    s+='<text class="leg" x="'+(X(E)+8)+'" y="'+(Tp+14)+'">fotopík</text><text class="sub" x="'+(X(emin+(E-emin)*0.45))+'" y="'+(Y(m.sc[Math.round((emin+(E-emin)*0.45-x0)/dx)])-8)+'" text-anchor="middle">rozptýlené fotony</text>';
    svg.innerHTML=s;
    $('.vw',host).textContent=w+' %';
    tb.innerHTML='<thead><tr><th>Detektor</th><th>Primární fotony v okně</th><th>Rozptýlené v okně</th><th>Podíl rozptýlených v obraze</th></tr></thead><tbody>'+
      OPT.map(function(o,j){var a=win(M[j]),sf=a.s/(a.p+a.s);return '<tr'+(j===sel?' style="font-weight:600"':'')+'><td>'+o.n+'</td><td>'+nf(100*a.p,1)+' %</td><td>'+nf(100*a.s/rho,1)+' %</td><td>'+nf(100*sf,1)+' %</td></tr>'}).join('')+'</tbody>';
    rd.innerHTML='Okno ± '+w+' % ('+nf(lo,0)+'–'+nf(hi,0)+' keV). Užší okno vyřadí víc rozptýlených fotonů, ale u detektoru se širokým fotopíkem začne vyřazovat i primární fotony.<br><span class="muted">Ilustrační model: před oknem je rozptýlených fotonů '+nf(rho*100,0)+' % z počtu primárních, spektrum rozptýlených fotonů roste lineárně od nejnižší možné energie po jednom rozptylu ('+nf(emin,0)+' keV) k energii fotopíku a je rozmazáno rozlišením detektoru. Skutečné spektrum závisí na pacientovi a geometrii. Rozlišení: '+(pet?'LYSO a BGO podle tabulky ve zdrojích (téma Detekce).':'NaI(Tl) ≈ 9,5 % a CZT ≈ 5,5 % jsou orientační hodnoty.')+'</span>';
  }
  host.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;sel=+c.dataset.i;host.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===c))});draw()});
  sl.addEventListener('input',function(){w=+sl.value;draw()});
  draw();
}

/* ---------- Typy koincidencí ---------- */
function mountCoinc(host){
  var sel=0, NAMES=['Pravá','Rozptýlená','Náhodná'];
  host.innerHTML='<div class="chips" role="group" aria-label="Typ koincidence">'+NAMES.map(function(n,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===0)+'">'+n+'</button>'}).join('')+'</div>'+
    '<svg class="chart" viewBox="0 0 560 270" role="img" aria-label="Prstenec detektorů se třemi typy koincidencí"></svg><p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), rd=$('.read',host), CX=280, CY=135, RR=112;
  function ring(p,deg){var a=deg*Math.PI/180,ux=Math.cos(a),uy=Math.sin(a),dx=p.x-CX,dy=p.y-CY,b=dx*ux+dy*uy,c=dx*dx+dy*dy-RR*RR,t=-b+Math.sqrt(b*b-c);return {x:p.x+ux*t,y:p.y+uy*t,a:Math.atan2(p.y+uy*t-CY,p.x+ux*t-CX)}}
  function det(a,on,bad){var x=CX+(RR+7)*Math.cos(a),y=CY+(RR+7)*Math.sin(a);return '<rect x="'+(x-8)+'" y="'+(y-8)+'" width="16" height="16" rx="3" transform="rotate('+(a*180/Math.PI+90)+' '+x+' '+y+')" style="fill:'+(on?(bad?'var(--bad)':'var(--accent)'):'var(--line)')+'"/>'}
  function line(a,b,cls){return '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="'+cls+'"/>'}
  function draw(){
    var s='<circle cx="'+CX+'" cy="'+CY+'" r="'+RR+'" style="fill:none;stroke:var(--line);stroke-width:1"/><ellipse class="body" cx="'+CX+'" cy="'+CY+'" rx="80" ry="62"/>';
    var lit=[],txt='',FG='stroke:var(--fg);stroke-width:2',AC='stroke:var(--accent);stroke-width:2.5',BAD='stroke:var(--bad);stroke-width:2;stroke-dasharray:6 4';
    var X=function(c){return '<path d="M'+(c.x-5)+' '+(c.y-5)+'L'+(c.x+5)+' '+(c.y+5)+'M'+(c.x+5)+' '+(c.y-5)+'L'+(c.x-5)+' '+(c.y+5)+'" style="stroke:var(--muted);stroke-width:2;fill:none"/>'};
    if(sel===0){
      var S={x:CX-12,y:CY-8}, a=ring(S,25), b=ring(S,205);
      s+=line(S,a,AC)+line(S,b,AC)+'<circle class="src" cx="'+S.x+'" cy="'+S.y+'" r="6"/>';
      lit=[[a.a,0],[b.a,0]];
      txt='<b>Pravá koincidence.</b> Oba fotony z jedné anihilace doletí k protilehlým detektorům bez rozptylu. Přímka mezi detektory (LOR) prochází zdrojem. Toto je užitečný signál (T).';
    }else if(sel===1){
      var S2={x:CX-12,y:CY-8}, a2=ring(S2,25), Q={x:S2.x+62*Math.cos(205*Math.PI/180),y:S2.y+62*Math.sin(205*Math.PI/180)}, b2=ring(Q,245);
      s+=line(S2,a2,AC)+line(S2,Q,AC)+line(Q,b2,AC)+'<circle class="src" cx="'+S2.x+'" cy="'+S2.y+'" r="6"/><circle cx="'+Q.x+'" cy="'+Q.y+'" r="4" style="fill:var(--fg)"/>';
      s+=line(a2,b2,BAD);
      lit=[[a2.a,1],[b2.a,1]];
      txt='<b>Rozptýlená koincidence.</b> Jeden foton se v těle rozptýlil (černý bod) a doletěl do jiného detektoru. Pár se zaznamená, ale přímka mezi detektory (čárkovaně) zdrojem neprochází. Zhoršuje kontrast. Částečně ji omezí energetické okno.';
    }else{
      var A1={x:CX-48,y:CY-22}, A2={x:CX+44,y:CY+26}, p1=ring(A1,60), p2=ring(A2,200);
      var o1={x:A1.x+Math.cos(240*Math.PI/180)*34,y:A1.y+Math.sin(240*Math.PI/180)*34}, o2={x:A2.x+Math.cos(20*Math.PI/180)*34,y:A2.y+Math.sin(20*Math.PI/180)*34};
      s+=line(A1,p1,AC)+line(A2,p2,AC)+line(A1,o1,'stroke:var(--muted);stroke-width:2;stroke-dasharray:2 3')+line(A2,o2,'stroke:var(--muted);stroke-width:2;stroke-dasharray:2 3')+X(o1)+X(o2);
      s+='<circle class="src" cx="'+A1.x+'" cy="'+A1.y+'" r="6"/><circle class="src" cx="'+A2.x+'" cy="'+A2.y+'" r="6"/>'+line(p1,p2,BAD);
      lit=[[p1.a,1],[p2.a,1]];
      txt='<b>Náhodná koincidence.</b> Dvě různé anihilace. U každé se zachytil jen jeden foton, druhý unikl nebo byl pohlcen (šedý křížek). Dva fotony z různých anihilací dorazily do koincidenčního okna, a vznikla přímka (čárkovaně), která nemá žádný vztah ke zdroji. Počet takových událostí roste s druhou mocninou aktivity.';
    }
    for(var i=0;i<32;i++){s+=det(i*Math.PI/16,false)}
    lit.forEach(function(l){s+=det(l[0],true,l[1])});
    svg.innerHTML=s; rd.innerHTML=txt;
  }
  host.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;sel=+c.dataset.i;host.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===c))});draw()});
  draw();
}

/* ---------- Náhodné koincidence a NEC ---------- */
function mountRand(host){
  var WIN=[{n:'2 ns',w:2},{n:'4,5 ns',w:4.5},{n:'9 ns',w:9},{n:'12 ns',w:12}], sel=1, A=300, id='ra'+(++uid);
  var T=function(a){return a}, S=function(a){return 0.35*a}, Rn=function(a,w){return 0.0009*(w/4.5)*a*a}, NEC=function(a,w){var t=T(a);if(!t)return 0;return t*t/(t+S(a)+2*Rn(a,w))};
  host.innerHTML='<div class="chips" role="group" aria-label="Koincidenční okno">'+WIN.map(function(o,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===sel)+'">okno '+o.n+'</button>'}).join('')+'</div>'+
    '<svg class="chart" viewBox="0 0 560 270" role="img" aria-label="Pravé a náhodné koincidence v závislosti na aktivitě"></svg>'+
    '<label class="sl" for="'+id+'">Aktivita ve zorném poli: <b class="va"></b><input id="'+id+'" type="range" min="10" max="800" step="10" value="300"></label><p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), sl=$('input',host), rd=$('.read',host);
  function draw(){
    var w=WIN[sel].w, Lf=48,R=530,Tp=18,B=222,TX=800,YM=800, X=function(x){return Lf+(R-Lf)*x/TX}, Y=function(v){return B-(B-Tp)*Math.min(v,YM)/YM};
    var s='';
    [0,200,400,600,800].forEach(function(v){s+='<line class="grid" x1="'+Lf+'" x2="'+R+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(Lf-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
    s+='<text class="sub" x="'+Lf+'" y="10">četnost [kcps]</text>';
    for(var x=0;x<=TX;x+=200){s+='<line class="tick" x1="'+X(x)+'" x2="'+X(x)+'" y1="'+B+'" y2="'+(B+5)+'"/><text x="'+X(x)+'" y="'+(B+21)+'" text-anchor="middle">'+x+' MBq</text>'}
    function path(f,cls,extra){var p='';for(var n=0;n<=80;n++){var a=TX*n/80;p+=(n?'L':'M')+X(a).toFixed(1)+' '+Y(f(a)).toFixed(1)+' '}return '<path class="'+cls+'" d="'+p+'"'+(extra||'')+'/>'}
    s+=path(T,'curve2')+path(function(a){return Rn(a,w)},'curve')+path(function(a){return NEC(a,w)},'',' style="fill:none;stroke:var(--fg);stroke-width:2.5"');
    s+='<text class="sub" x="'+(X(790))+'" y="'+(Y(T(790))-8)+'" text-anchor="end">pravé T</text>';
    s+='<text class="leg" x="'+(X(790))+'" y="'+(Y(Math.min(YM,Rn(790,w)))+(Rn(790,w)>YM?16:-8))+'" text-anchor="end">náhodné R</text>';
    s+='<text class="lab" x="'+(X(790))+'" y="'+(Y(NEC(790,w))+16)+'" text-anchor="end">NEC</text>';
    s+='<line class="vl" x1="'+X(A)+'" x2="'+X(A)+'" y1="'+Tp+'" y2="'+B+'"/><circle class="mk" cx="'+X(A)+'" cy="'+Y(Rn(A,w))+'" r="5"/><circle class="mk2" cx="'+X(A)+'" cy="'+Y(T(A))+'" r="5"/>';
    svg.innerHTML=s;
    $('.va',host).textContent=A+' MBq';
    var t=T(A), sc=S(A), r=Rn(A,w), nec=NEC(A,w);
    rd.innerHTML='Při <b>'+A+' MBq</b> a okně '+WIN[sel].n+': pravé <b>'+nf(t,0)+'</b>, rozptýlené '+nf(sc,0)+', náhodné <b>'+nf(r,0)+'</b> kcps. Náhodné tvoří <b>'+nf(100*r/(t+sc+r),1)+' %</b> všech zaznamenaných koincidencí. NEC = T²/(T + S + 2R) = <b>'+nf(nec,0)+' kcps</b>, tedy '+nf(100*nec/t,0)+' % pravých.<br><span class="muted">Ilustrační konstanty: T roste lineárně s aktivitou, R = 2τ·S₁·S₂ roste s jejím druhým mocninou a úměrně šířce okna. Skutečný NEC má navíc maximum, protože na vysokých četnostech působí mrtvá doba (tu model neobsahuje).</span>';
  }
  host.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;sel=+c.dataset.i;host.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===c))});draw()});
  sl.addEventListener('input',function(){A=+sl.value;draw()});
  draw();

/* ---------- Time-of-flight ---------- */

    '<svg class="chart" viewBox="0 0 560 210" role="img" aria-label="Rozdělení pravděpodobnosti polohy anihilace podél přímky LOR"></svg>'+
    '<label class="sl" for="'+id+'">Průměr těla (délka LOR v těle): <b class="vd"></b><input id="'+id+'" type="range" min="20" max="50" step="1" value="40"></label><p class="read" aria-live="polite"></p>';
  var svg=$('svg',host), sl=$('input',host), rd=$('.read',host), PX=8, CX=280, CY=120;
  function draw(){
    var o=OPT[sel], half=D*PX/2, x0=CX+3*PX, s='';
    s+='<ellipse class="body" cx="'+CX+'" cy="'+CY+'" rx="'+half+'" ry="60"/>';
    s+='<line x1="24" y1="'+CY+'" x2="536" y2="'+CY+'" style="stroke:var(--muted);stroke-width:1.5"/>';
    s+='<rect x="8" y="'+(CY-34)+'" width="16" height="68" rx="3" style="fill:var(--muted)" opacity=".5"/><rect x="536" y="'+(CY-34)+'" width="16" height="68" rx="3" style="fill:var(--muted)" opacity=".5"/>';
    s+='<text x="16" y="'+(CY+54)+'" text-anchor="middle" style="font-size:11px">detektor</text><text x="544" y="'+(CY+54)+'" text-anchor="middle" style="font-size:11px">detektor</text>';
    var dxm=o.t?0.1499*o.t:0, h0=14, d='';
    if(!o.t){d='M'+(CX-half)+' '+CY+'L'+(CX-half)+' '+(CY-h0)+'L'+(CX+half)+' '+(CY-h0)+'L'+(CX+half)+' '+CY+'Z'}
    else{
      var sg=dxm/10/2.355, sgp=sg*PX, pk=Math.min(100,h0*D/(sg*2.5066));
      d='M'+(CX-half)+' '+CY;
      for(var x=CX-half;x<=CX+half;x+=2){var h=pk*Math.exp(-Math.pow(x-x0,2)/(2*sgp*sgp));d+='L'+x+' '+(CY-h).toFixed(1)}
      d+='L'+(CX+half)+' '+CY+'Z';
    }
    s+='<path d="'+d+'" style="fill:var(--accent);fill-opacity:.28;stroke:var(--accent);stroke-width:2"/>';
    s+='<circle class="mk" cx="'+x0+'" cy="'+CY+'" r="6"/><text x="'+x0+'" y="'+(CY+22)+'" text-anchor="middle" style="font-size:11px">skutečné místo anihilace</text>';
    svg.innerHTML=s;
    $('.vd',host).textContent=D+' cm';
    var h='';
    if(!o.t) h='<b>Bez TOF</b> je známa jen přímka LOR. Anihilace mohla proběhnout kdekoli podél ní, rekonstrukce proto rozdělí signál rovnoměrně přes celý průchod tělem ('+D+' cm).';
    else{
      var dx=0.1499*o.t/10, gain=D/dx;
      h='Časové rozlišení <b>'+o.t+' ps</b> určí polohu podél LOR s nejistotou Δx = c·Δt/2 ≈ <b>'+nf(dx,1)+' cm</b>.<br>'+(dx>=D?'Nejistota je větší než průměr těla, takže TOF nic nepřinese.':'Orientační zisk citlivosti ≈ D/Δx = <b>'+nf(gain,1)+' ×</b>, zisk poměru signál/šum ≈ √(D/Δx) = <b>'+nf(Math.sqrt(gain),1)+' ×</b>.');
    }
    rd.innerHTML=h+'<br><span class="muted">Komerční TOF přístroje mívají 400–550 ps (starší), novější SiPM systémy kolem 200–300 ps. Vzorce platí pro jednoduchý případ rovnoměrné aktivity a analytickou rekonstrukci. U iterativní rekonstrukce je zisk závislý na úloze a menší.</span>';
  }
  host.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;sel=+c.dataset.i;host.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===c))});draw()});
  sl.addEventListener('input',function(){D=+sl.value;draw()});
  draw();
}

/* ---------- Rozlišení PET ---------- */
function mountPetRes(host){
  var ISO=[{n:'F-18',s:0.54},{n:'Ga-68',s:1.35},{n:'Rb-82',s:2.60}], sel=0, d=4, DR=83, bd=0, ia='r'+(++uid), ib='r'+(++uid), ic='r'+(++uid);
  host.innerHTML='<div class="chips" role="group" aria-label="Radionuklid">'+ISO.map(function(o,j){return '<button type="button" class="chip" data-i="'+j+'" aria-pressed="'+(j===sel)+'">'+o.n+'</button>'}).join('')+'</div>'+
    '<label class="sl" for="'+ia+'">Šířka krystalu: <b class="va"></b><input id="'+ia+'" type="range" min="1.5" max="6" step="0.5" value="4"></label>'+
    '<label class="sl" for="'+ib+'">Průměr prstence: <b class="vb"></b><input id="'+ib+'" type="range" min="40" max="100" step="1" value="83"></label>'+
    '<label class="sl" for="'+ic+'">Chyba určení zasaženého krystalu: <b class="vc"></b><input id="'+ic+'" type="range" min="0" max="3" step="0.1" value="0"></label>'+
    '<div class="chain"></div><p class="read" aria-live="polite"></p>';
  var ch=$('.chain',host), rd=$('.read',host), sa=$('#'+ia,host), sb=$('#'+ib,host), sc=$('#'+ic,host);
  function row(l,v,mx,cls){return '<div class="row"><div class="lb"><span>'+l+'</span><b>'+nf(v,2)+' mm</b></div><div class="bar'+(cls?' '+cls:'')+'"><i style="width:'+Math.min(100,100*v/mx)+'%"></i></div></div>'}
  function draw(){
    var o=ISO[sel], c1=d/2, c2=o.s, c3=0.0022*DR*10, c4=bd, tot=1.25*Math.sqrt(c1*c1+c2*c2+c3*c3+c4*c4), mx=Math.max(4,c1,c2,c3,c4,tot);
    ch.innerHTML=row('Šířka krystalu / 2',c1,mx)+row('Dosah pozitronu ('+o.n+')',c2,mx)+row('Nekolinearita 0,0022 · D',c3,mx)+row('Určení krystalu',c4,mx)+row('Výsledné rozlišení = 1,25 · √(součet druhých mocnin)',tot,mx,'alt');
    $('.va',host).textContent=nf(d,1)+' mm'; $('.vb',host).textContent=DR+' cm'; $('.vc',host).textContent=nf(bd,1)+' mm';
    rd.innerHTML='Výsledné rozlišení v modelu <b>'+nf(tot,1)+' mm</b>. Největší příspěvek: <b>'+(function(){var a=[[c1,'šířka krystalu'],[c2,'dosah pozitronu'],[c3,'nekolinearita'],[c4,'určení krystalu']];a.sort(function(x,y){return y[0]-x[0]});return a[0][1]})()+'</b>.<br><span class="muted">Vzorec a hodnoty dosahu (F-18 0,54 mm, Ga-68 1,35 mm, Rb-82 2,60 mm) jsou ze zdroje. Klinický přístroj má šířku krystalu zhruba 4 mm a prstenec 83 cm. Další příspěvky (hloubka interakce, rekonstrukce) zde nejsou.</span>';
  }
  host.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;sel=+c.dataset.i;host.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===c))});draw()});
  sa.addEventListener('input',function(){d=+sa.value;draw()}); sb.addEventListener('input',function(){DR=+sb.value;draw()}); sc.addEventListener('input',function(){bd=+sc.value;draw()});
  draw();
}


/* ---------- Kvíz ---------- */
var QSTATE={};
function mountQuiz(host,key,qs){
  var st=QSTATE[key]||(QSTATE[key]={i:0,score:0,picked:null});
  function render(){
    if(st.i>=qs.length){
      host.innerHTML='<div class="meta"><span>Kvíz hotov</span><span>'+qs.length+' otázek</span></div><div class="score">'+st.score+' / '+qs.length+'</div><p style="margin:0">'+(st.score===qs.length?'Bez chyby.':'Projdi výklad a zkus to znovu.')+'</p><button type="button" class="btn ghost" data-act="again">Zkusit znovu</button>';
      return;
    }
    var q=qs[st.i], L='ABCD', done=st.picked!==null;
    if(!st.ord||st.oi!==st.i){st.ord=q.o.map(function(_,x){return x});for(var z=st.ord.length-1;z>0;z--){var r=Math.floor(Math.random()*(z+1)),tmp=st.ord[z];st.ord[z]=st.ord[r];st.ord[r]=tmp}st.oi=st.i}
    host.innerHTML='<div class="meta"><span>Otázka '+(st.i+1)+' z '+qs.length+'</span><span>skóre '+st.score+'</span></div>'+
      '<p class="qq">'+q.q+'</p><div class="opts">'+
      st.ord.map(function(j,pos){ var o=q.o[j];
        var c=''; if(done){ if(j===q.a) c=' ok'; else if(j===st.picked) c=' bad'; }
        return '<button type="button" class="opt'+c+'" data-j="'+j+'"'+(done?' disabled':'')+'><span class="l">'+L[pos]+'</span><span>'+o+'</span></button>';
      }).join('')+'</div>'+
      (done?'<p class="why" role="status"><b>'+(st.picked===q.a?'Správně. ':'Ne tak docela. ')+'</b>'+q.w+'</p><button type="button" class="btn" data-act="next">'+(st.i+1<qs.length?'Další otázka':'Zobrazit skóre')+'</button>':'');
  }
  host.addEventListener('click',function(e){
    var o=e.target.closest('.opt'), a=e.target.closest('[data-act]');
    if(o&&st.picked===null){st.picked=+o.dataset.j; if(st.picked===qs[st.i].a) st.score++; render();var nb=$('[data-act="next"]',host);if(nb) nb.focus({preventScroll:true})}
    else if(a){ if(a.dataset.act==='next'){st.i++;st.picked=null} else {st.i=0;st.score=0;st.picked=null} render(); }
  });
  render();
}

/* ---------- Aplikace ---------- */
var app=$('#app'), nav=$('#nav'), main=$('#main');
var S={mod:'spect',topic:0};

function parseHash(){
  var m=/^#(spect|pet)-([0-8])$/.exec(location.hash);
  if(m){S.mod=m[1];S.topic=+m[2]}
}
function go(mod,topic){ location.hash=mod+'-'+topic }

function render(){
  redrawers.length=0;
  app.dataset.mod=S.mod;
  $('#b-spect').setAttribute('aria-pressed',String(S.mod==='spect'));
  $('#b-pet').setAttribute('aria-pressed',String(S.mod==='pet'));
  nav.innerHTML=OUTLINE.map(function(o){
    var ready=!!CONTENT[S.mod][o.id];
    return (o.id===1?'<span class="sep"></span>':'')+'<button type="button" data-t="'+o.id+'"'+(o.id===S.topic?' aria-current="page"':'')+'><span class="no">'+(o.no||o.id)+'</span><span>'+o.t+(o.hw?'<em>HW</em>':'')+'</span><i class="dot'+(ready?' on':'')+'" title="'+(ready?'k dispozici':'připravuje se')+'"></i></button>';
  }).join('');
  var o=OUTLINE[S.topic], c=CONTENT[S.mod][S.topic], h='';
  h+='<p class="eyebrow">'+MODNAME[S.mod]+'</p><h2>'+(o.id?o.id+'. ':'')+o.t+'</h2>';
  if(c){
    c.blocks.forEach(function(b){
      if(typeof b==='string') h+='<div class="prose">'+b+'</div>';
      else if(b.gloss) h+='<details class="gloss"><summary>Slovníček pojmů</summary><dl>'+GLOSS[S.mod].map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>'}).join('')+'</dl></details>';
      else h+='<figure class="widget"><figcaption><strong>'+b.title+'</strong><span>'+b.lead+'</span></figcaption><div data-w="'+b.w+'" data-k="'+(b.k||'')+'"></div></figure>';
    });
    h+='<p class="sec">Kvíz</p><section class="quiz" id="quiz" aria-label="Kvíz"></section>';
    if(c.src) h+='<p class="sec">Zdroje</p><p class="srcs">'+c.src+'</p>';
  }else{
    h+='<div class="soon"><p><b>Tento modul se připravuje.</b> Z osnovy se v něm projde:</p><ul>'+o.a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><p>Stejným způsobem jako úvod: výklad od základů, animace a kvíz s vysvětlením.</p>'+
       (o.id>=5&&o.id<=7?'<p>Čísla a pravidla pro ČR doplníme až po ověření ve zdrojích.</p>':'')+'</div>';
  }
  var prev=OUTLINE[S.topic-1], next=OUTLINE[S.topic+1];
  h+='<div class="pager">'+(prev?'<button type="button" class="btn ghost" data-t="'+prev.id+'">← '+prev.t+'</button>':'<span></span>')+(next?'<button type="button" class="btn ghost" data-t="'+next.id+'">'+next.t+' →</button>':'')+'</div>';
  h+='<p class="foot">Stav: koncept k validaci. Fyzikální údaje a ekonomická část budou před finální verzí ověřeny ve zdrojích, u každého tématu je uveden seznam použitých.</p>';
  main.innerHTML=h;
  if(c){
    main.querySelectorAll('[data-w]').forEach(function(el){
      var t=el.dataset.w;
      if(t==='decay') mountDecay(el,el.dataset.k);
      else if(t==='bateman') mountBateman(el);
      else if(t==='annih') mountAnnih(el);
      else if(t==='emis') mountEmis(el);
      else if(t==='collim') mountCollim(el);
      else if(t==='recon') mountRecon(el,el.dataset.k);
      else if(t==='lor') mountLor(el);
      else if(t==='logist') mountLogist(el);
      else if(t==='stack') mountStack(el,el.dataset.k);
      else if(t==='stop') mountStop(el,el.dataset.k);
      else if(t==='pmt') mountPmt(el,el.dataset.k);
      else if(t==='locate') mountLocate(el,el.dataset.k);
      else if(t==='direct') mountDirect(el);
 else if(t==='colres') mountColres(el);
 else if(t==='compton') mountCompton(el,el.dataset.k);
 else if(t==='spectrum') mountSpectrum(el,el.dataset.k);
 else if(t==='coinc') mountCoinc(el);
 else if(t==='rand') mountRand(el);
 else if(t==='tof') mountTof(el);
 else if(t==='petres') mountPetRes(el);
    });
    mountQuiz($('#quiz'),S.mod+'-'+S.topic,c.quiz);
  }
}

$('#b-spect').addEventListener('click',function(){go('spect',S.topic)});
$('#b-pet').addEventListener('click',function(){go('pet',S.topic)});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-t]'); if(!b||!(nav.contains(b)||main.contains(b))) return;
  go(S.mod,+b.dataset.t); window.scrollTo(0,0);
});
window.addEventListener('hashchange',function(){parseHash();render()});
var redrawAll=function(){redrawers.forEach(function(f){f()})};
if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redrawAll);
new MutationObserver(redrawAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

parseHash(); render();
})();
</script>
