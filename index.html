<title>Interaktivní SPECT a PET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky hlavička s přepínačem SPECT/PET, vlevo osnova (Úvod + osnova od učitele), vpravo výklad s animacemi uprostřed textu a kvíz na konci.
   Akcent se mění s modalitou: SPECT jantarový, PET modrý. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --fg:#13202C; --muted:#55657A; --line:#D3DCE6; --scan:#0B1118;
  --spect:#A4460B; --pet:#1B52C9; --on-accent:#FFFFFF; --ok:#157347; --bad:#B42318;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#152130; --fg:#E5ECF3; --muted:#9AA9BB; --line:#263648;
    --spect:#F2A25C; --pet:#7FB0FF; --on-accent:#0E1620; --ok:#4CC38A; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#152130; --fg:#E5ECF3; --muted:#9AA9BB; --line:#263648;
  --spect:#F2A25C; --pet:#7FB0FF; --on-accent:#0E1620; --ok:#4CC38A; --bad:#FF8A80;
  color-scheme:dark;
}
.app[data-mod="spect"]{--accent:var(--spect)}
.app[data-mod="pet"]{--accent:var(--pet)}
.app{--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface))}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font:15px/1.65 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .in{max-width:1120px;margin:0 auto;padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand h1{margin:0;font:700 20px/1.2 var(--font-display);letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sw{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.sw button{min-height:40px;padding:8px 20px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:600 15px var(--font-display);cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.layout{max-width:1120px;margin:20px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.nav button{display:flex;gap:10px;align-items:baseline;flex:none;padding:9px 12px;border:1px solid transparent;border-radius:9px;background:transparent;font:500 14px/1.35 var(--font-body);text-align:left;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.nav .no{font:500 12px var(--font-mono);color:var(--muted);min-width:1.1em}
.nav .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);flex:none;align-self:center}
.nav .dot.on{background:var(--accent);border-color:var(--accent)}
.nav em{font:500 10px var(--font-mono);font-style:normal;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.nav .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
@media (min-width:880px){
  .layout{grid-template-columns:250px minmax(0,1fr);gap:36px}
  .nav{flex-direction:column;overflow:visible;position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start}
  .nav button{white-space:normal}
  .nav .dot{margin-left:auto}
  .nav .sep{width:auto;height:1px;margin:4px 8px}
}

main{min-width:0}
.eyebrow{margin:0 0 6px;font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
main h2{margin:0 0 20px;font:700 clamp(26px,5vw,36px)/1.15 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.prose{max-width:68ch}
.prose h3{margin:34px 0 8px;font:600 20px/1.3 var(--font-display);text-wrap:balance}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin-bottom:6px}
.prose .key{margin:0 0 14px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.prose .key p{margin:0}
.k{font-family:var(--font-mono);font-size:.92em}
.sec{margin:44px 0 12px;font:600 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;margin:0 0 16px;max-width:100%}
.tbl table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:600 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td:first-child{font-family:var(--font-mono);white-space:nowrap}
.gloss{max-width:68ch;margin:28px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 16px}
.gloss summary{cursor:pointer;font:600 16px var(--font-display);padding:12px 0}
.gloss dl{margin:0 0 12px}
.gloss dt{font-weight:600;margin-top:10px}
.gloss dd{margin:2px 0 0;color:var(--muted)}

.widget{margin:20px 0 22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:12px;min-width:0}
.widget figcaption strong{display:block;font:600 17px var(--font-display)}
.widget figcaption span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:transparent;font:500 13px var(--font-mono);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:13px var(--font-mono)}
.chart .sub{font-size:11px;opacity:.85}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{stroke:var(--muted);stroke-width:1}
.chart .curve{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.chart .curve2{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:7 5}
.chart .vl{stroke:var(--fg);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.chart .mk{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .mk2{fill:var(--muted);stroke:var(--surface);stroke-width:2}
.chart .lab{fill:var(--fg);font-weight:500}
.chart .leg{fill:var(--accent);font-weight:500}
.chart .body{fill:var(--bg);stroke:var(--line);stroke-width:2}
.chart .organ{fill:var(--line)}
.chart .dev{fill:var(--muted);opacity:.55}
.chart .src{fill:var(--accent)}
.chart .ray{stroke:var(--accent);stroke-width:2;fill:none}
.chart .ringe{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.chart .xtal{stroke:var(--muted);stroke-width:7;opacity:.45}
.sl{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.sl input{width:100%;min-height:32px;accent-color:var(--accent)}
.sl input:disabled{opacity:.4}
.read{margin:0;font-variant-numeric:tabular-nums;min-height:3.4em}
.read .muted{color:var(--muted)}
.cv{width:100%;height:290px;display:block;border-radius:8px;background:var(--bg)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.duo .cv{height:290px}
.btn{justify-self:start;min-height:40px;padding:8px 16px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:var(--on-accent);font:600 14px var(--font-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio figure{margin:0}
.trio canvas{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;background:var(--scan)}
.trio figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.big{font:700 28px var(--font-display);font-variant-numeric:tabular-nums}

.chain{display:grid;gap:6px}
.chain .row{display:grid;gap:3px}
.chain .lb{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.chain .lb b{color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.chain .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.chain .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chain .bar.alt i{background:var(--muted)}
.quiz{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:14px;max-width:760px}
.quiz .meta{display:flex;justify-content:space-between;gap:12px;font:500 12px var(--font-mono);color:var(--muted)}
.quiz .qq{margin:0;font:600 18px/1.4 var(--font-display)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:baseline;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;font:15px/1.45 var(--font-body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font:600 13px var(--font-mono);color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.why{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
.score{font:700 40px var(--font-display)}

.soon{max-width:68ch;padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.soon p{margin:0 0 8px}
.soon ul{margin:0 0 10px;padding-left:20px}
.srcs{max-width:68ch;font-size:13px;color:var(--muted)}
.srcs a{color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.foot{margin:28px 0 0;max-width:68ch;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app" data-mod="spect">
  <header class="hdr"><div class="in">
    <div class="brand"><h1>Interaktivní SPECT a PET</h1><p>Výukový prototyp · koncept k validaci</p></div>
    <div class="sw" role="group" aria-label="Modalita">
      <button type="button" id="b-spect" aria-pressed="true">SPECT</button>
      <button type="button" id="b-pet" aria-pressed="false">PET</button>
    </div>
  </div></header>
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Osnova"></nav>
    <main id="main"></main>
  </div>
</div>

CONTENT.spect[0]={
 blocks:[
 `<h3>Co to je</h3>
  <p><b>SPECT</b> (Single Photon Emission Computed Tomography, česky jednofotonová emisní výpočetní tomografie) je zobrazovací metoda nukleární medicíny. Neukazuje, jak orgány vypadají, ale <b>jak fungují</b>: kam v těle se dostala podaná látka, kolik krve protéká srdečním svalem, jak intenzivně se přestavuje kost, jak pracuje štítná žláza. Výsledkem je trojrozměrný obraz složený z řezů.</p>
  <p>Název se dá přečíst po částech:</p>
  <ul>
  <li><b>Emission</b>: záření vychází z těla pacienta, protože mu byla podána radioaktivní látka.</li>
  <li><b>Single photon</b>: měří se jednotlivé fotony záření gama, každý zvlášť.</li>
  <li><b>Computed tomography</b>: obraz řezů se počítá z měření pořízených z mnoha úhlů.</li>
  </ul>
  <h3>Proč to existuje</h3>
  <p>RTG, CT i magnetická rezonance ukazují hlavně <b>stavbu</b> těla. Nemoc ale často změní funkci dřív, než se změní tvar. Srdeční sval s nedostatečným prokrvením může na CT vypadat normálně a drobné nádorové ložisko v kosti ještě nemusí kost viditelně poškodit. Funkční obraz proto doplňuje ten anatomický.</p>
  <p>Hlavní rozdíl proti RTG a CT je v tom, <b>kde je zdroj záření</b>. Přepni si to na schématu.</p>`,
 {w:'emis',title:'Odkud záření přichází',lead:'Dvě zásadně odlišné metody. SPECT a PET patří mezi emisní.'},
 `<h3>Princip v pěti krocích</h3>
  <ol>
  <li><b>Radiofarmakum.</b> Připraví se látka, kterou tělo zpracovává předvídatelným způsobem (nosič), a označí se radioaktivním atomem, který vysílá záření gama (značka).</li>
  <li><b>Podání.</b> Většinou injekcí do žíly, méně často vdechnutím nebo polknutím. Látky je tak málo, že průběh sledovaného děje neovlivní (stopovací princip).</li>
  <li><b>Rozmístění.</b> Podle vlastností nosiče se látka během desítek minut až hodin nahromadí v určitých místech. Zbytek se z krve vyloučí.</li>
  <li><b>Snímání.</b> Pacient leží u gamakamery. Záření z těla letí všemi směry. Kamera přijme jen fotony letící téměř kolmo na její povrch. Ostatní zachytí kolimátor.</li>
  <li><b>Výpočet.</b> Kamera se otáčí kolem pacienta a snímá z mnoha úhlů. Počítač z těchto pohledů dopočítá trojrozměrné rozložení látky.</li>
  </ol>
  <h3>Proč je potřeba kolimátor</h3>
  <p>Foton gama z jednoho místa v těle letí všemi směry. Kdyby před tělem stál holý detektor, každý jeho bod by dostával fotony ze všech míst těla a vznikla by jen rozmazaná skvrna. <b>Kolimátor</b> je olověná deska s mnoha dlouhými úzkými otvory. Propustí jen fotony letící podél os otvorů, ostatní pohltí olověné přepážky. Každý bod detektoru tak „vidí“ jen úzký sloupec těla.</p>
  <p>Zkus to na modelu. Dva zdroje v těle jsou od sebe vzdáleny, a přesto je bez kolimátoru na detektoru nerozlišíš.</p>`,
 {w:'collim',title:'Co dělá kolimátor',lead:'Přepni kolimátor a měň délku otvorů. Sleduj, kolik fotonů projde a jak ostré jsou píky.'},
 `<div class="key"><p><b>Kompromis, který určuje SPECT.</b> Kolimátor dává informaci o směru, a tím o poloze, ale vyhodí většinu fotonů. Delší a užší otvory dají ostřejší obraz, ale propustí méně fotonů. Ve skutečném 3D kolimátoru dosáhne detektoru řádově jen 0,01 % vyzářených fotonů (10⁻⁴). Typické prostorové rozlišení SPECT je 8–12 mm.</p></div>
  <h3>Z pohledů k řezům (tomografie)</h3>
  <p>Jeden snímek z jednoho úhlu je jen <b>součet signálu podél směru pohledu</b>. Nevíme z něj, v jaké hloubce zdroj leží. Když se kamera otočí a změří totéž z mnoha úhlů, souhlasí se všemi pohledy jediné prostorové rozložení zdrojů a počítač ho dopočítá. Soubor všech pohledů se jmenuje <b>sinogram</b> (každý řádek je jeden úhel).</p>
  <p>Nejjednodušší výpočet je <b>zpětná projekce</b>: každý změřený pohled se „rozetře“ zpět přes obraz ve směru, odkud přišel. Sečtením pohledů vznikne obraz, který je ale rozmazaný. Odstraní se <b>filtrací</b>. Vyzkoušej to.</p>`,
 {w:'recon',k:'spect',title:'Z pohledů k obrazu',lead:'Přidávej pohledy a zapni filtr. Vlevo je skutečné rozložení (včetně jednoho „studeného“ ložiska), uprostřed změřená data, vpravo rekonstrukce.'},
 `<p>Skutečná rekonstrukce ve SPECT používá nejčastěji iterativní metody, které navíc počítají s fyzikou měření (téma Softwarový dopočet). Typicky se snímá z desítek až kolem stovky úhlů.</p>
  <h3>K čemu se SPECT používá</h3>
  <ul>
  <li><b>Kosti:</b> nádorová ložiska, záněty, zlomeniny, které na RTG ještě nejsou vidět.</li>
  <li><b>Srdce:</b> prokrvení srdečního svalu při zátěži a v klidu.</li>
  <li><b>Mozek:</b> prokrvení a některé přenosové systémy, například při podezření na parkinsonský syndrom.</li>
  <li><b>Štítná žláza a příštítná tělíska, plíce, ledviny:</b> funkce a prokrvení.</li>
  </ul>
  <h3>Jak se liší od PET</h3>
  <p>Obě metody jsou emisní a funkční. SPECT detekuje <b>jednotlivé fotony</b> a potřebuje kolimátor, proto má nižší citlivost (řádově 100× nižší) a horší rozlišení (8–12 mm proti 4–6 mm u PET). Zato je přístroj levnější a nejčastější radionuklid Tc-99m se získává z generátoru bez cyklotronu. Podrobně v modulu PET.</p>`,
 {gloss:1}
 ],
 quiz:[
  {q:'Co znamená, že je SPECT „emisní“ metoda?',o:['Používá magnetické pole','Záření vysílá přístroj a měří se, kolik ho projde','Záření vychází z těla pacienta, z podané radioaktivní látky','Pacient musí vdechovat radioaktivní plyn'],a:2,w:'Zdroj záření je uvnitř těla. U RTG a CT je zdroj mimo tělo a měří se, kolik záření projde.'},
  {q:'K čemu slouží kolimátor?',o:['Zesiluje signál z detektoru','Propustí jen fotony letící přibližně kolmo k detektoru, a tím určí směr','Mění energii fotonů','Chladí krystal'],a:1,w:'Bez kolimátoru by každý bod detektoru dostával fotony ze všech míst těla a obraz by byl jen rozmazaná skvrna.'},
  {q:'Co se stane, když kolimátor zúžíme a prodloužíme jeho otvory?',o:['Obraz je ostřejší, ale detektor zachytí méně fotonů','Obraz je ostřejší a zachytí víc fotonů','Obraz je méně ostrý a zachytí méně fotonů','Nic, otvory nemají vliv'],a:0,w:'Je to kompromis rozlišení a citlivosti. Zkus to na modelu: delší otvory zúží píky, ale sníží počet zachycených fotonů.'},
  {q:'Proč je potřeba snímat z mnoha úhlů?',o:['Aby pacient dostal menší dávku','Aby se zvýšila energie fotonů','Jeden pohled určuje jen součet podél směru, polohu v hloubce dá až kombinace úhlů','Aby se zkrátil poločas'],a:2,w:'Jeden pohled určuje jen součet signálu podél směru. Teprve z mnoha úhlů se dá dopočítat, kde přesně zdroje jsou.'},
  {q:'Čím se SPECT zásadně liší od CT?',o:['Má lepší prostorové rozlišení než CT','Nepoužívá žádné záření','Zobrazuje pouze kosti','Ukazuje funkci (rozložení podané látky), ne jen stavbu těla'],a:3,w:'Rozlišení SPECT je naopak horší, řádově milimetry až centimetr. Jeho síla je ve funkční informaci.'}
 ]
};

CONTENT.spect[1]={
 blocks:[
 `<h3>Co je radionuklid a záření gama</h3>
  <p>Jádro některých atomů je nestabilní a samo se po čase přemění, při čemž vyšle záření. Takový atom je <b>radionuklid</b>. Rozpad nejde urychlit, zpomalit ani ovlivnit chemií, řídí se jen pravděpodobností.</p>
  <p><b>Záření gama</b> je elektromagnetické záření (proud fotonů) jako světlo nebo rentgen, jen s mnohem vyšší energií. Energie fotonu se udává v <b>keV</b>: viditelné světlo má jednotky eV, diagnostický rentgen desítky keV, SPECT nuklidy jednotky až stovky keV. Čím vyšší energie, tím pronikavější záření.</p>
  <p>Kolik jader se rozpadá, udává <b>aktivita</b> v becquerelech: 1 Bq je jeden rozpad za sekundu. Pacientovi se podávají stovky MBq, tedy stovky milionů rozpadů za sekundu. Aktivita s časem klesá. <b>Poločas rozpadu T½</b> je doba, za kterou klesne na polovinu, a je pro každý nuklid pevný.</p>`,
 {w:'decay',k:'spect',title:'Rozpad radionuklidu',lead:'Posuň čas a sleduj, kolik aktivity zbývá. Každý poločas ji sníží na polovinu.'},
 `<h3>Co chceme od dobrého SPECT nuklidu</h3>
  <ul>
  <li><b>Záření gama vhodné energie</b>, zhruba 100–200 keV. Příliš nízká energie se v těle pohltí dřív, než unikne. Příliš vysoká projde kolimátorem i krystalem a obraz je horší.</li>
  <li><b>Poločas odpovídající vyšetření</b>, tedy hodiny. Příliš krátký se nestihne dopravit a snímat, příliš dlouhý zbytečně prodlužuje ozáření.</li>
  <li><b>Žádné nebo málo záření β</b> (letící částice). Z těla nevyletí, takže nepřispěje k obrazu, jen zvyšuje dávku.</li>
  <li><b>Chemie</b>, která dovolí nuklid navázat na nosič.</li>
  <li><b>Dostupnost a cena.</b></li>
  </ul>
  <div class="tbl"><table>
  <thead><tr><th>Nuklid</th><th>Záření</th><th>Poločas</th><th>K čemu se hodí</th></tr></thead>
  <tbody>
  <tr><td>Tc-99m</td><td>γ 140 keV</td><td>6,0 h</td><td>většina vyšetření: kosti, srdce, plíce, ledviny, štítná žláza</td></tr>
  <tr><td>I-123</td><td>γ 159 keV</td><td>13,2 h</td><td>štítná žláza, mozek, nervové zásobení srdce</td></tr>
  <tr><td>Tl-201</td><td>rtg. záření 69–83 keV</td><td>73 h</td><td>srdeční sval (starší metoda)</td></tr>
  <tr><td>In-111</td><td>γ 171 a 245 keV</td><td>2,8 d</td><td>zánět (značené bílé krvinky), některé nádory</td></tr>
  <tr><td>Ga-67</td><td>γ 93, 185, 300 keV</td><td>3,3 d</td><td>zánět, některé lymfomy</td></tr>
  </tbody></table></div>
  <div class="key"><p><b>Proč dominuje Tc-99m.</b> Má ideální energii 140 keV, poločas 6 h, rozpadá se téměř jen vyzářením fotonu gama (izomerní přechod) a dá se vyrábět v nemocnici z generátoru. Chemie technecia umožňuje navázat ho na velké množství nosičů.</p></div>
  <h3>Jak se dostane do těla</h3>
  <p>Samotný radionuklid by se v těle choval podle své chemie, ne podle toho, co chceme zobrazit. Proto se naváže na <b>nosič</b>, molekulu, jejíž chování v těle známe. Hotová látka je <b>radiofarmakum</b>. Nosič určuje <b>kam</b> se látka dostane, radionuklid <b>prozradí</b>, kde je.</p>
  <p>Několik příkladů, jak to funguje:</p>
  <ul>
  <li><b>Kosti.</b> Nosič je molekula, která se váže na minerál kostní tkáně. Víc jí zachytí místa, kde se kost právě intenzivně přestavuje: zlomenina, zánět nebo nádorové ložisko. Tam je na obraze vyšší signál.</li>
  <li><b>Srdeční sval.</b> Nosič proudí krví a zachytí se v buňkách srdečního svalu úměrně tomu, kolik krve k nim dorazí. Za zúženou tepnou je látky méně, vznikne místo s nižším signálem.</li>
  <li><b>Plíce.</b> Podají se nepatrné částice větší než nejmenší plicní cévky. Uváznou tam, kam proudí krev. Chybějící signál znamená místo, kam krev neteče, třeba při plicní embolii.</li>
  <li><b>Štítná žláza.</b> Potřebuje jód na tvorbu hormonů, proto zachytává jód i chemicky podobný technecistan.</li>
  </ul>
  <p>Podává se nejčastěji <b>injekcí do žíly</b>, někdy vdechnutím (plyny a aerosoly při vyšetření plic) nebo polknutím (např. sledování vyprazdňování žaludku). Mezi podáním a snímáním je doba čekání od desítek minut po hodiny. Látka musí dojít na místo a z krve zmizet nadbytek, aby nezhoršoval kontrast. Množství látky je nepatrné, takže sledovaný děj neovlivní.</p>
  <h3>Jak se dá vyrobit</h3>
  <p>Tc-99m má poločas jen 6 h a z výrobny by se do nemocnice nedovezl. Řešení: dopravit <b>rodiče s delším poločasem</b> a nechat z něj dceřiný nuklid vznikat přímo na místě. Rodič je <b>Mo-99</b> (T½ 66 h), dcera Tc-99m. Zařízení se jmenuje <b>generátor</b>.</p>
  <ol>
  <li>V jaderném reaktoru vzniká Mo-99, nejčastěji štěpením uranu U-235, ze kterého se chemicky vyizoluje.</li>
  <li>Mo-99 je navázán na kolonu z oxidu hlinitého ve stíněném generátoru, který se doveze do nemocnice.</li>
  <li>Mo-99 se rozpadá na Tc-99m, který vzniká uvnitř kolony.</li>
  <li>Přes kolonu se protlačí fyziologický roztok (<b>eluce</b>). Vymyje Tc-99m jako technecistan, Mo-99 zůstane zachycen.</li>
  <li>Eluát se smíchá s <b>kitem</b>: lahvičkou se sterilním práškem nosiče a redukčním činidlem (typicky cínatá sůl), které technecium převede do podoby schopné se navázat. Vznikne radiofarmakum. Před podáním se ověřuje jeho radiochemická čistota.</li>
  </ol>`,
 {w:'bateman',title:'Generátor Mo-99/Tc-99m',lead:'Po eluci je kolona prázdná od Tc-99m a ten dorůstá z Mo-99. Posuň čas po eluci.'},
 `<p>Tc-99m po eluci znovu dorůstá a největší množství je zhruba po 23 h, proto se generátor obvykle eluuje jednou denně. Mo-99 mezitím ubývá (poločas 66 h), takže se generátor po zhruba týdnu vymění. Mo-99 se vyrábí jen v několika málo reaktorech na světě, proto se při jejich odstávkách objevují výpadky dodávek. Cyklotronová výroba Tc-99m se vyvíjí jako alternativa.</p>
  <h3>Bezpečnost</h3>
  <p>Ionizující záření může poškodit DNA. Pro ochranu se předpokládá, že riziko roste s dávkou a že bezpečný práh neexistuje. Dávka se udává v <b>sievertech</b> (Sv), v praxi v mSv (tisícina Sv). Pro orientaci: průměrné roční ozáření z přírodních zdrojů je ve světě ≈ 2,4 mSv, kostní scintigrafie s Tc-99m dá pacientovi řádově 4 mSv.</p>
  <ul>
  <li><b>Pacient.</b> Vyšetření musí být <b>ospravedlněné</b> (přínos převáží riziko) a <b>optimalizované</b> (podá se nejnižší aktivita, která dá dostatečný obraz). Limit dávky pro pacienta neexistuje, platí ospravedlnění a optimalizace, k tomu slouží diagnostické referenční úrovně.</li>
  <li><b>Personál.</b> Pro něj dávkové limity platí. Ochrana stojí na třech věcech: <b>čas</b> (pracovat co nejkratší dobu), <b>vzdálenost</b> (dávka klesá s druhou mocninou vzdálenosti) a <b>stínění</b> (olovo, stíněné stříkačky, stíněná přípravna). K tomu osobní dozimetry a vymezené zóny pracoviště.</li>
  <li><b>Okolí.</b> Pacienti dostávají pokyny: hodně pít a často močit, omezit blízký kontakt s dětmi a těhotnými několik hodin. Odpad se nechá rozpadnout: po 10 poločasech (u Tc-99m 60 h) zbývá asi 0,1 % aktivity.</li>
  </ul>
  <p>Práce s radionuklidy v ČR podléhá dohledu <b>SÚJB</b> (Státní úřad pro jadernou bezpečnost) podle atomového zákona (263/2016 Sb.) a jeho prováděcích vyhlášek, například 422/2016 Sb.</p>`
 ],
 src:`Orientační hodnoty kolimátoru a rozlišení: <a href="https://socr.umich.edu/BPAD1/BPAD1_notes/BPAD1_Chap06_NuclearMedicine_PET_SPECT.html" target="_blank" rel="noopener">SOCR, učební poznámky k PET a SPECT</a>. Údaje o nuklidech (poločasy, energie) a dávkách jsou obecně známé hodnoty, které je potřeba doložit proti NuDat a publikacím ICRP 106/107.`,
 quiz:[
  {q:'Proč je Tc-99m nejpoužívanějším nuklidem ve SPECT?',o:['Emituje pozitrony, takže stačí koincidenční detekce','Je téměř čistý γ‑zářič 140 keV s poločasem ≈ 6 h','Má poločas několik dní, takže se dá skladovat','Vyrábí se přímo v nemocničním cyklotronu'],a:1,w:'140 keV dobře zvládne NaI(Tl) i olověný kolimátor a poločas 6 h stačí na přípravu a vyšetření. Pozitrony patří do PET a Tc‑99m se získává z generátoru.'},
  {q:'Co je uvnitř generátoru Mo-99/Tc-99m?',o:['Cyklotronový terčík s vodou obohacenou O‑18','Miniaturní reaktor','Kolona s navázaným Mo‑99, ze které se vymývá Tc‑99m','Hotové radiofarmakum připravené k aplikaci'],a:2,w:'Mo‑99 (T½ 66 h) zůstává na koloně a rozpadá se na Tc‑99m. Fyziologický roztok vymyje technecistan, nosič se přidá až poté z kitu.'},
  {q:'Kdy je po předchozí eluci v generátoru nejvíc Tc-99m?',o:['Zhruba po 23 h','Hned po eluci','Po ≈ 6 h (jeden poločas Tc‑99m)','Po ≈ 66 h (jeden poločas Mo‑99)'],a:0,w:'Dorůstání vrcholí, když je vznik z Mo‑99 stejně rychlý jako rozpad Tc‑99m. Z poločasů 66 h a 6 h vychází ≈ 23 h, v grafu je to vidět.'},
  {q:'Co určuje, kam se radiofarmakum v těle dostane?',o:['Energie gama záření','Typ detektoru v kameře','Poločas radionuklidu','Chemický nosič, na který je nuklid navázaný'],a:3,w:'Radionuklid jen vysílá signál. Místo určuje nosič, například molekula, která se váže na kost, nebo částice, které uváznou v plicních kapilárách.'},
  {q:'Kolik aktivity Tc-99m zbude po 24 h (4 poločasy)?',o:['≈ 50 %','≈ 25 %','≈ 12 %','≈ 6 %'],a:3,w:'4 poločasy znamenají 1/2⁴ = 1/16, tedy ≈ 6 %.'},
  {q:'Proč se do radiofarmaka dává jen nepatrné množství látky?',o:['Aby se rychleji rozpadla','Aby látka neovlivnila sledovaný děj v těle (stopovací princip)','Aby měla vyšší energii','Aby ji kolimátor nepohltil'],a:1,w:'Cílem je jen sledovat, kudy látka jde, ne zasahovat do fyziologie. Proto stačí velmi malé látkové množství.'},
  {q:'Proč je žádoucí, aby nuklid nevyzařoval částice β?',o:['β částice zesilují obraz','β částice se nemohou rozpadnout','β částice poškozují kolimátor','β částice nevyletí z těla, takže jen zvyšují dávku'],a:3,w:'Do obrazu přispívají jen fotony, které z těla uniknou. Částice β se v tkáni zastaví a jejich energie zůstane pacientovi.'}
 ]
};

CONTENT.pet[0]={
 blocks:[
 `<h3>Co to je</h3>
  <p><b>PET</b> (Positron Emission Tomography, česky pozitronová emisní tomografie) je stejně jako SPECT <b>funkční a emisní</b> metoda: ukazuje, jak tkáně pracují, na základě záření z podané radioaktivní látky. Liší se tím, jaké záření se měří. Radionuklid vysílá <b>pozitron</b>, který se hned srazí s elektronem a vzniknou <b>dva fotony po 511 keV</b> letící opačnými směry. Zachytit se dají jako dvojice.</p>
  <p>V praxi se PET dělá téměř vždy jako <b>PET/CT</b> (nebo PET/MR): PET dává funkci, CT stavbu těla a pomáhá s opravou útlumu záření.</p>
  <h3>Proč to existuje</h3>
  <p>Nejběžnější radiofarmakum je <b>FDG</b>, glukóza označená radioaktivním fluorem. Ukáže, kde tkáň spotřebovává hodně glukózy. To dokáže odhalit nádorová ložiska, která na CT ještě nemají zřetelný tvar, zjistit rozsah nemoci, posoudit odpověď na léčbu a zobrazit zánět. Další použití jsou v neurologii (demence, epilepsie) a kardiologii (životaschopnost srdečního svalu).</p>
  <p>Přepni si schéma a porovnej, odkud záření přichází u různých metod.</p>`,
 {w:'emis',title:'Odkud záření přichází',lead:'Dvě zásadně odlišné metody. SPECT a PET patří mezi emisní.'},
 `<h3>Princip v krocích</h3>
  <ol>
  <li><b>Radiofarmakum.</b> Nejčastěji FDG: glukóza, ve které je jedna skupina nahrazena radioaktivním fluorem-18.</li>
  <li><b>Podání</b> injekcí do žíly.</li>
  <li><b>Rozmístění.</b> U FDG zhruba hodinu, pacient při ní odpočívá, aby se svaly nezatěžovaly a nevychytávaly látku.</li>
  <li><b>Rozpad.</b> Jádro fluoru vyšle pozitron. Ten uletí zlomek milimetru až milimetry, srazí se s elektronem a anihiluje. Vzniknou dva fotony 511 keV letící přibližně opačně.</li>
  <li><b>Detekce.</b> Pacient leží v prstenci detektorů. Dva fotony zasáhnou protilehlé detektory <b>téměř současně</b> (koincidence, okno několik nanosekund).</li>
  <li><b>Výpočet.</b> Každá takto zachycená dvojice vymezí přímku (<b>LOR</b>), na které anihilace proběhla. Z milionů LOR se spočítá obraz.</li>
  </ol>
  <h3>Elektronická kolimace: proč je PET citlivější</h3>
  <p>SPECT potřebuje olověný kolimátor, který zahodí většinu fotonů. PET informaci o směru získá jinak: dva fotony letí opačně, takže stačí zaznamenat, <b>které dva detektory zasáhly zároveň</b>. Žádné olovo nic nezahazuje, proto se tomu říká elektronická kolimace. Citlivost PET (podíl vyzářených fotonů, které se zaznamenají) je řádově 10⁻², u SPECT 10⁻⁴, tedy zhruba <b>stokrát vyšší</b>.</p>
  <p>Na modelu uvidíš, jak se z jednotlivých přímek poskládá obraz.</p>`,
 {w:'lor',title:'Přímky koincidence (LOR)',lead:'Posouvej počet zachycených událostí. Každá dvojice fotonů je jedna přímka. Průsečíky ukážou, kde jsou zdroje.'},
 `<p>Jedna LOR říká jen „anihilace proběhla někde na této přímce“. Poloha vznikne až průnikem mnoha přímek. Při malém počtu událostí je obraz zrnitý (statistický šum), proto se vyšetření prodlužuje nebo se podá větší aktivita.</p>
  <h3>Co omezuje ostrost</h3>
  <ul>
  <li><b>Dosah pozitronu.</b> PET vidí místo anihilace, ne místo rozpadu (viz téma Zdroj signálu).</li>
  <li><b>Nekolinearita.</b> Fotony letí pod úhlem 180° ± 0,25°, ne přesně opačně.</li>
  <li><b>Velikost krystalů detektoru</b> a to, jak přesně se určí, který krystal foton zasáhl.</li>
  </ul>
  <p>Výsledné rozlišení klinického PET je typicky 4–6 mm, tedy lepší než u SPECT (8–12 mm).</p>
  <h3>Z přímek k řezům (rekonstrukce)</h3>
  <p>Na stejném principu jako u SPECT: změřená data jsou souhrnem „pohledů“ z mnoha úhlů (sinogram) a počítač z nich dopočítá rozložení látky. Rozdíl je v tom, že PET má všechny úhly najednou, protože prstenec obklopuje celé tělo. Zkus si, jak počet pohledů a filtrace ovlivní obraz.</p>`,
 {w:'recon',k:'pet',title:'Z pohledů k obrazu',lead:'Přidávej pohledy a zapni filtr. Vlevo je skutečné rozložení, uprostřed změřená data, vpravo rekonstrukce.'},
 `<h3>K čemu se PET používá</h3>
  <ul>
  <li><b>Onkologie:</b> nalezení nádoru a jeho rozsahu, kontrola odpovědi na léčbu.</li>
  <li><b>Neurologie:</b> demence, ložiska epilepsie.</li>
  <li><b>Kardiologie:</b> životaschopnost a prokrvení srdečního svalu.</li>
  <li><b>Zánět a infekce.</b></li>
  </ul>
  <h3>Jak se liší od SPECT</h3>
  <ul>
  <li>Měří <b>dvojice fotonů 511 keV</b> (koincidence) místo jednotlivých fotonů s kolimátorem.</li>
  <li>Je zhruba <b>100× citlivější</b> a má lepší rozlišení (4–6 mm).</li>
  <li>Radionuklidy jsou krátkodobé a často potřebují <b>cyklotron</b> poblíž, přístroj je dražší.</li>
  <li>Radionuklidy lehkých prvků (uhlík, dusík, kyslík, fluor) umožňují označit molekuly, aniž by se jejich chemie změnila.</li>
  </ul>`,
 {gloss:1}
 ],

 blocks:[
 `<h3>Pozitron a anihilace</h3>
  <p>V jádře některých radionuklidů je příliš mnoho protonů. Jádro se stabilizuje tak, že se jeden proton změní na neutron a vyletí <b>pozitron</b> (β⁺) a neutrino. Pozitron je <b>antičástice elektronu</b>: stejná hmotnost, ale kladný náboj.</p>
  <p>V tkáni pozitron ztrácí energii srážkami a po uletění <b>desetin až jednotek milimetru</b> se potká s elektronem. Obě částice zaniknou (<b>anihilace</b>) a jejich hmotnost se přemění na energii: vzniknou <b>dva fotony</b>, každý s energií <b>511 keV</b>, což odpovídá klidové energii elektronu. Kvůli zachování hybnosti letí téměř přesně opačně (180° ± 0,25°).</p>
  <div class="key"><p><b>511 keV je stejné pro všechny PET nuklidy.</b> Přístroj proto hledá jedinou energii, ať je radionuklid jakýkoli.</p></div>`,
 {w:'annih',title:'Pozitron, anihilace a chyba polohy',lead:'Vlevo je celé tělo v prstenci detektorů, vpravo silně přiblížený detail zdroje (mřížka 1 mm). Vyšli pozitron: nejdřív uletí kousek od zdroje, pak anihiluje a oba fotony se zachytí v detektorech. Přímka mezi nimi zdroj mine o vyznačenou vzdálenost.'},
 `<p>PET vidí <b>místo anihilace, ne místo rozpadu</b>. Dosah pozitronu je proto první fyzikální limit ostrosti: u F-18 je zanedbatelný, u Ga-68 a hlavně Rb-82 už znatelný.</p>
  <h3>Které nuklidy a proč</h3>
  <p>Hlavní přednost PET je v tom, že lze použít radionuklidy <b>lehkých prvků: uhlíku, dusíku, kyslíku a fluoru</b>. Uhlík, dusík a kyslík mají stejnou chemii jako stabilní atomy v těle, takže značená molekula je chemicky totožná s přirozenou. Fluor-18 nahrazuje malou skupinu (např. hydroxyl) a tělo to většinou toleruje, proto FDG. Kovy (Ga-68, Rb-82) se na nosič vážou přes chelátor.</p>
  <div class="tbl"><table>
  <thead><tr><th>Nuklid</th><th>Poločas</th><th>Dosah pozitronu</th><th>Výroba</th><th>Použití</th></tr></thead>
  <tbody>
  <tr><td>F-18</td><td>109,8 min</td><td>≈ 0,6 mm</td><td>cyklotron</td><td>FDG (glukóza), PSMA, kosti</td></tr>
  <tr><td>Ga-68</td><td>67,7 min</td><td>≈ 3 mm</td><td>generátor Ge-68/Ga-68</td><td>PSMA, neuroendokrinní nádory</td></tr>
  <tr><td>C-11</td><td>20,4 min</td><td>≈ 1,2 mm</td><td>cyklotron na místě</td><td>mozkové receptory, některé nádory</td></tr>
  <tr><td>N-13</td><td>10,0 min</td><td>≈ 1,8 mm</td><td>cyklotron na místě</td><td>prokrvení srdce (amoniak)</td></tr>
  <tr><td>O-15</td><td>2,04 min</td><td>≈ 3 mm</td><td>cyklotron na místě</td><td>prokrvení (voda)</td></tr>
  <tr><td>Rb-82</td><td>1,26 min</td><td>≈ 6 mm</td><td>generátor Sr-82/Rb-82</td><td>prokrvení srdce</td></tr>
  </tbody></table></div>
  <p>Střední dosah v tabulce je orientační hodnota z literatury a bude ještě ověřena.</p>
  <h3>FDG: co to je a proč svítí nádory</h3>
  <p>FDG je <b>glukóza, ve které je jedna skupina nahrazena radioaktivním fluorem-18</b>. Buňka ji přijme stejnou cestou jako glukózu: přes glukózové transportéry a první enzym spotřeby cukru (hexokináza) ji označí fosfátem na FDG-6-fosfát. Další zpracování ale enzymy neprovedou, a FDG proto v buňce <b>zůstane zachycena</b>.</p>
  <p>Svítí tedy místa, kde buňky glukózu spotřebovávají hodně. Mnohé nádory mají zvýšený příjem glukózy (využívají ji i v přítomnosti kyslíku, tzv. Warburgův jev). Je třeba počítat s tím, že FDG se normálně hromadí i v mozku, srdci a močových cestách a také v zánětu, a že některé nádory FDG vychytávají slabě. Interpretace proto patří do rukou zkušeného lékaře.</p>
  <p><b>Příprava pacienta.</b> Podle doporučení EANM (verze 1.0) pacient nejí alespoň 6 h před podáním, protože glukóza v krvi soutěží s FDG o transportéry a inzulin by FDG vtáhl do svalů a tuku. Před aplikací se měří glykémie (doporučení verze 1.0 uvádí hodnotu pod 7 mmol/l, konkrétní limit stanoví protokol pracoviště). Mezi podáním a snímáním je přibližně 60 minut. Aktivita bývá kolem 2,5 MBq/kg u 3D přístrojů, tedy řádově stovky MBq.</p>
  <h3>Jak se dá vyrobit</h3>
  <p><b>Cyklotron</b> je kruhový urychlovač. Protony kroužící ve vakuu mezi dvěma elektrodami ve tvaru písmene D drží na kruhové dráze magnetické pole a elektrické pole je při každém oběhu urychlí. Po tisících oběhů mají energii řádově 10–20 MeV. Svazek pak dopadne na terčík z <b>vody obohacené izotopem kyslíku O-18</b>. Reakcí <span class="k">¹⁸O(p,n)¹⁸F</span> proton jádro kyslíku zachytí, uvolní neutron a vznikne F-18 (jako fluorid).</p>
  <p>Fluorid se v automatickém syntezátoru ve stíněné „horké cele“ zabuduje do molekuly FDG a výsledek se přečistí. Nakonec následuje <b>kontrola kvality</b>: čistota, pH, bakteriální endotoxiny, sterilita. Radiofarmakum je léčivý přípravek s požadavky správné výrobní praxe.</p>
  <p>Poločas 110 min znamená, že FDG se musí vyrobit blízko a dovézt rychle. Spočítej si proč.</p>`,
 {w:'logist',title:'Kolik se musí vyrobit, aby dorazilo dost',lead:'Při aplikaci má být 300 MBq. Kolik aktivity musí být na začátku převozu?'},
 `<p>Nuklidy Ga-68 a Rb-82 se získávají z generátorů. Rodič Ge-68 (T½ 271 dnů) vydrží generátoru řadu měsíců, Sr-82 (T½ 25 dnů) zhruba měsíc. Nuklidy C-11, N-13 a O-15 se kvůli minutovým poločasům vyrábějí cyklotronem přímo u přístroje.</p>
  <h3>Bezpečnost</h3>
  <p>Fotony 511 keV jsou mnohem pronikavější než fotony Tc-99m (140 keV). Poloviční vrstva olova, která zeslabí záření na polovinu, je zhruba 0,3 mm pro 140 keV, ale kolem 4 mm pro 511 keV, tedy více než desetkrát tlustší. Dávkový příkon z F-18 na jednotku aktivity je také několikanásobně vyšší než u Tc-99m. Práce proto probíhá za silnějším stíněním (olovo, wolfram), s automatickými dávkovači a injektory a s prstovými dozimetry.</p>
  <ul>
  <li><b>Pacient.</b> Dávka z FDG je asi 0,019 mSv/MBq, takže při ≈ 250 MBq vychází zhruba 5 mSv. U PET/CT se přičítá dávka z CT, která závisí na protokolu. Platí ospravedlnění a optimalizace stejně jako u SPECT.</li>
  <li><b>Personál.</b> Čas, vzdálenost, stínění, osobní dozimetry a vymezené zóny. Dávky na ruce se sledují zvlášť.</li>
  <li><b>Okolí.</b> FDG se vylučuje močí, proto pacient pije, často močí a po vyšetření omezuje blízký kontakt s dětmi a těhotnými po dobu stanovenou pracovištěm. Odpad F-18 se nechá rozpadnout: po 10 poločasech (≈ 18 h) zbývá asi 0,1 % aktivity.</li>
  </ul>
  <p>Dohled provádí <b>SÚJB</b> podle atomového zákona (263/2016 Sb.) a jeho prováděcích vyhlášek.</p>`
 ],
 src:`Doporučení pro FDG PET/CT: <a href="https://link.springer.com/content/pdf/10.1007/s00259-009-1297-4.pdf" target="_blank" rel="noopener">EANM procedure guidelines for tumour PET imaging, verze 1.0</a>. Citlivost, rozlišení a nekolinearita: <a href="https://socr.umich.edu/BPAD1/BPAD1_notes/BPAD1_Chap06_NuclearMedicine_PET_SPECT.html" target="_blank" rel="noopener">SOCR, učební poznámky k PET a SPECT</a>. Údaje o nuklidech (poločasy, dosahy), poloviční vrstvy a dávky jsou obecně známé hodnoty, které je potřeba doložit proti NuDat a publikacím ICRP 106/107.`,

  {q:'Co je u PET zdrojem signálu?',o:['Dva fotony po 511 keV vznikající anihilací pozitronu','Jeden foton 140 keV z izomerního přechodu','Světlo z fotonásobiče','Elektrony z konverze v krystalu'],a:0,w:'Pozitron anihiluje s elektronem na dva fotony po 511 keV letící zhruba opačně. Fotonásobič a krystal jsou až součástí detekce.'},

 ['Blokový detektor','Matice krystalů čtená několika fotodetektory, poloha zasaženého krystalu se určí z poměru jejich signálů.']

CONTENT.spect[2]={
 blocks:[
 `<h3>Jak se záření gama měří</h3>
  <p>Foton gama nelze v detektoru „vidět“ přímo. Měří se tak, že v materiálu předá energii elektronům a ty vytvoří měřitelný signál. Při energiích používaných ve SPECT jsou důležité dva procesy:</p>
  <ul>
  <li><b>Fotoefekt</b>: foton zanikne a celou svou energii předá jednomu elektronu. Pravděpodobnost je největší v materiálech s vysokým protonovým číslem, například v jodu (Z = 53).</li>
  <li><b>Comptonův rozptyl</b>: foton předá elektronu jen část energie a pokračuje jiným směrem. Pokud pak z detektoru unikne, naměří se jen část původní energie.</li>
  </ul>
  <p>Velikost signálu je úměrná energii, kterou foton v detektoru zanechal. Detektor tedy měří nejen <b>polohu</b> a <b>počet</b> fotonů, ale i jejich <b>energii</b>. Podle ní se pak vybírají fotony s očekávanou energií (téma Lokalizace zdroje).</p>
  <p>Energii lze na elektrický signál převést dvěma způsoby:</p>
  <ol>
  <li><b>Nepřímá konverze</b> (scintilační detektor): krystal energii přemění na záblesk světla a fotodetektor světlo na elektrický signál. Používá se v klasické gamakameře.</li>
  <li><b>Přímá konverze</b>: polovodič přemění energii fotonu rovnou na elektrický náboj. Používá se v kamerách s detektory CZT.</li>
  </ol>
  <h3>Jak je gamakamera postavena</h3>
  <p>Kamera se skládá z vrstev, kterými foton postupně prochází. Klikni na vrstvu a přečti si, co dělá.</p>`,
 {w:'stack',k:'spect',title:'Řez gamakamerou',lead:'Foton přichází shora od pacienta. Vyber vrstvu.'},
 `<h3>Scintilátor: krystal NaI(Tl)</h3>
  <p><b>Scintilátor</b> je materiál, který po pohlcení záření krátce zasvítí. Počet světelných fotonů je úměrný pohlcené energii. Pro SPECT se používá <b>jodid sodný aktivovaný thaliem, NaI(Tl)</b>.</p>
  <ul>
  <li>Čistý NaI svítí při pokojové teplotě slabě. Malá příměs <b>thalia</b> (aktivátor) vytvoří v krystalu centra, přes která se energie vyzáří jako viditelné světlo (kolem 415 nm).</li>
  <li><b>Světelný výtěžek ≈ 38 fotonů/keV</b> je z běžných scintilátorů nejvyšší. Foton 140 keV tak vytvoří zhruba 5 300 světelných fotonů.</li>
  <li><b>Dosvit ≈ 230 ns.</b> Pro SPECT stačí, protože se nepoužívá koincidence.</li>
  <li><b>Hustota 3,67 g/cm³</b> a jod (Z = 53) zajišťují, že při 140 keV foton většinou projde fotoefektem.</li>
  <li>NaI pohlcuje vodu, krystal je proto <b>hermeticky zapouzdřený</b> v hliníku s okénkem.</li>
  <li>Krystaly lze vyrobit ve velkých deskách (desítky cm) a jsou levné.</li>
  </ul>
  <h3>Proč tloušťka zhruba 9,5 mm</h3>
  <p>Tloušťka je kompromis. Čím tlustší krystal, tím víc fotonů zastaví (vyšší citlivost). Ale světlo vzniká v různých hloubkách a v tlustém krystalu se rozptýlí do větší plochy, takže se poloha záblesku určuje hůř (horší rozlišení). Pro 140 keV vychází jako vhodné zhruba 9,5 mm. Pro vyšší energie se používají tlustší krystaly. Vyzkoušej, co to dělá:</p>`,
 {w:'stop',k:'spect',title:'Kolik fotonů krystal zastaví',lead:'Posuň tloušťku krystalu. Čára ukazuje podíl fotonů, které v krystalu interagují.'},
 `<p>Z grafu je vidět, že tenký krystal zastaví fotony 140 keV dobře, ale pro 511 keV (PET) by byl málo účinný. Proto má PET jiné krystaly (modul PET).</p>
  <h3>Fotonásobič: převod světla na elektrický signál</h3>
  <p>Záblesk světla je velmi slabý: z asi 5 300 světelných fotonů se po ztrátách na krystalu a světlovodu a po převodu na elektrony zbývá řádově <b>stovky elektronů</b>. To je příliš málo na zpracování v elektronice, signál se proto musí zesílit. Používá se <b>fotonásobič</b> (photomultiplier tube, PMT):</p>
  <ol>
  <li><b>Fotokatoda</b>: světelný foton z ní vyrazí elektron (fotoefekt). Kvantová účinnost je řádově 25 %, tedy zhruba každý čtvrtý foton vytvoří elektron.</li>
  <li><b>Dynody</b> (kolem 10 stupňů): elektrony jsou elektrickým polem urychleny na první dynodu. Každý dopadající elektron z ní vyrazí několik (zhruba 3–5) sekundárních elektronů. Ty jsou urychleny na další dynodu a tak dále.</li>
  <li><b>Anoda</b>: sbírá lavinu elektronů. Výstup je krátký impuls náboje úměrný počtu fotoelektronů, tedy energii fotonu.</li>
  </ol>
  <p>Celkové zesílení je δⁿ (δ je násobení na jedné dynodě, n počet dynod), řádově <b>10⁶</b>. Vyzkoušej, jak ho ovlivní napětí a počet dynod:</p>`,
 {w:'pmt',k:'spect',title:'Řetěz fotonásobiče',lead:'Vyber radionuklid, nastav počet dynod a napětí mezi nimi. Čárami je vidět, kolik elektronů je po každém stupni (logaritmická škála).'},
 `<div class="key"><p><b>Proč fotonásobič.</b> Signál z krystalu je slabý a rychlý. Fotonásobič ho zesílí milionkrát při velmi nízkém šumu, odpoví za zlomky mikrosekundy a lze ho vyrobit s velkou plochou. Zesílení je navíc úměrné vstupnímu signálu, takže se energie nezkreslí. Nevýhody: velký objem, křehkost, vysoké napětí (stovky až ≈ 1000 V) a citlivost na magnetické pole.</p></div>
  <p>Počet fotoelektronů určuje i <b>energetické rozlišení</b>. Počet je statisticky rozdělený a jeho relativní kolísání je úměrné 1/√N. Čím víc fotoelektronů, tím přesnější je měření energie. V grafu výše je vidět statistický limit. Skutečné rozlišení gamakamery je horší (ztráty světla, nerovnoměrnosti, šum elektroniky) a pro 140 keV bývá zhruba 9–10 %.</p>
  <h3>Jak se určí poloha: Angerova logika</h3>
  <p>Jeden velký krystal je čten polem několika desítek fotonásobičů (37 až 91 podle velikosti kamery). Světlo z jednoho záblesku se rozdělí mezi sousední fotonásobiče: nejblíž ležící dostane nejvíc, vzdálenější míň. <b>Poloha záblesku se spočítá jako vážený průměr poloh fotonásobičů</b> (váha je jejich signál). <b>Součet signálů je úměrný energii</b>, podle ní se rozhodne, zda událost zařadit do obrazu.</p>
  <p>Zkus to na modelu: klikni na krystal a sleduj signály, vypočtenou polohu a chybu. Poté vyšli 100 událostí a změň počet fotoelektronů.</p>`,
 {w:'locate',k:'spect',title:'Angerova logika',lead:'Výřez ze 3 × 3 fotonásobičů. Klikni na krystal a zkus polohu u okraje: odhad se tam stahuje ke středu, což se ve skutečné kameře koriguje kalibračními mapami.'},
 `<p>Tato metoda je základ klasické gamakamery. Vnitřní (intrinsické) prostorové rozlišení kamery je několik milimetrů (zhruba 3–4 mm). Výsledné rozlišení SPECT je horší (8–12 mm), protože ho určuje hlavně kolimátor.</p>
  <h3>Varianta s přímou konverzí: detektory CZT</h3>
  <p>Scintilační řetěz má několik kroků a v každém se část signálu ztratí: energie → světlo → fotoelektrony → zesílení. Počet nosičů, na kterých je signál založen, je malý (stovky fotoelektronů), což omezuje energetické rozlišení.</p>
  <p><b>Přímá konverze</b> vynechá světlo. Polovodič <b>CZT (kadmium-zinek-tellur, CdZnTe)</b> je mezi dvěma elektrodami s napětím (stovky V). Foton gama v něm vytvoří <b>páry elektron–díra</b> (jeden pár stojí zhruba 4,6 eV energie, tedy z fotonu 140 keV vzniká kolem 30 000 párů). Elektrické pole je rozdělí a náboj putuje k elektrodám, kde vytvoří přímo elektrický impuls. Elektrody jsou rozdělené na <b>pixely</b> (řádově jednotky mm), poloha zásahu je dána pixelem.</p>`,
 {w:'direct',title:'Scintilátor a polovodič: počet nosičů signálu',lead:'Posuň energii fotonu. Porovnej, kolik nosičů signálu vznikne v obou typech detektorů a jaký je statistický limit rozlišení.'},
 `<p>Výhody CZT: <b>lepší energetické rozlišení</b> (zhruba 5–6 % při 140 keV proti 9–10 % u NaI(Tl)), což umožňuje lépe odlišit nerozptýlené fotony od rozptýlených (téma Lokalizace zdroje), <b>kompaktnější</b> kamery (bez světlovodu a fotonásobičů) a pixelová struktura s přesně danou polohou. Kamery s CZT dosahují vyšší citlivosti při stejném rozlišení, proto se používají například u dedikovaných kardiologických kamer (D-SPECT, Discovery NM 530c).</p>
  <p>Nevýhody: <b>vysoká cena</b> a obtížná výroba velkých bezvadných krystalů, proto jsou detektory skládané z malých modulů. Díry se v CZT pohybují pomalu a částečně se zachycují na vadách, takže část náboje se nesbere a ve spektru vzniká nízkoenergetický „ocas“ (hole tailing), který se koriguje elektronikou. Vlastnosti zesílení a šumu závisejí na teplotě.</p>
  <div class="tbl"><table>
  <thead><tr><th></th><th>NaI(Tl) + fotonásobiče</th><th>CZT (přímá konverze)</th></tr></thead>
  <tbody>
  <tr><td>Signál</td><td>světlo → fotoelektrony</td><td>páry elektron–díra</td></tr>
  <tr><td>Energetické rozlišení při 140 keV</td><td>≈ 9–10 %</td><td>≈ 5–6 %</td></tr>
  <tr><td>Určení polohy</td><td>výpočet z poměru signálů fotonásobičů</td><td>pixel</td></tr>
  <tr><td>Velikost detektoru</td><td>světlovod a trubice, tlustší kamera</td><td>kompaktní moduly</td></tr>
  <tr><td>Cena a výroba</td><td>levné, velké desky</td><td>drahé, malé moduly</td></tr>
  <tr><td>Typické použití</td><td>univerzální gamakamery</td><td>dedikované (např. kardiologické) kamery</td></tr>
  </tbody></table></div>`,
 {gloss:1}
 ],
 src:`Tabulka scintilátorů (NaI(Tl): hustota 3,67 g/cm³, světelný výtěžek 38, dosvit 230 ns): <a href="https://socr.umich.edu/BPAD1/BPAD1_notes/BPAD1_Chap06_NuclearMedicine_PET_SPECT.html" target="_blank" rel="noopener">SOCR, učební poznámky k PET a SPECT, Table 6</a>. Hodnoty zesílení a kvantové účinnosti fotonásobiče, tloušťka krystalu 9,5 mm, účinnost 140 keV, energetické rozlišení 9–10 % a 5–6 % a parametry CZT (≈ 4,6 eV na pár) jsou obecně známé orientační údaje, které je třeba doložit v učebnici (např. Cherry, Sorenson, Phelps: Physics in Nuclear Medicine; Knoll: Radiation Detection and Measurement). Délka útlumu NaI(Tl) pro 140 keV (≈ 3,9 mm v grafu) je odvozena z typické účinnosti ≈ 90 % pro 9,5 mm a bude upřesněna z tabulek NIST XCOM.`,
 quiz:[
  {q:'Čím se u klasické gamakamery převede energie fotonu gama na elektrický signál?',o:['Přímo polovodičem, který vytvoří elektrický proud','Scintilačním krystalem (záblesk světla) a fotonásobičem (světlo na elektrony a jejich zesílení)','Olověným kolimátorem','Magnetickým polem'],a:1,w:'Je to nepřímá konverze: foton → světlo v krystalu NaI(Tl) → elektrony na fotokatodě → zesílení v dynodách. Kolimátor jen vybírá směr.'},
  {q:'Proč se do krystalu NaI přidává thalium?',o:['Aby krystal byl hustší','Aby krystal byl radioaktivní','Aby se energie vyzářila jako viditelné světlo a krystal dobře svítil','Aby se zvýšila tloušťka'],a:2,w:'Příměs thalia (aktivátor) vytvoří centra, přes která se energie vyzáří jako viditelné světlo. Čistý NaI svítí při pokojové teplotě slabě.'},
  {q:'Proč se používá fotonásobič a ne jen jednoduchý fotodetektor bez zesílení?',o:['Signál ze scintilačního záblesku je jen stovky elektronů, což je pro elektroniku málo, a fotonásobič ho zesílí zhruba milionkrát při nízkém šumu','Fotonásobič vytváří světlo, které krystal nevyzáří','Fotonásobič zvyšuje energii fotonu','Bez fotonásobiče by nebyl potřeba krystal'],a:0,w:'Bez zesílení by byl náboj řádově 10⁻¹⁶ C, pod úrovní šumu elektroniky. Dynody ho zvýší na desítky až stovky pC.'},
  {q:'Proč mají gamakamery krystaly jen zhruba 9,5 mm tlusté, a ne mnohem tlustší?',o:['Tlustší krystal zastaví méně fotonů','Tlustší krystal rozptyluje světlo do větší plochy a zhoršuje určení polohy, takže 9,5 mm je kompromis citlivosti a rozlišení','Tlustší krystal nelze vyrobit','Tlustší krystal pohlcuje více záření β'],a:1,w:'Tlustší krystal zastaví víc fotonů, ale světlo z hlubších záblesků se rozptýlí na větší plochu a poloha je méně přesná.'},
  {q:'Jak se v Angerově logice určí poloha záblesku?',o:['Poloha je dána jen nejsilnějším fotonásobičem','Z doby letu fotonu','Jako vážený průměr poloh fotonásobičů, kde váhou je jejich signál; součet signálů udává energii','Z energie fotonu'],a:2,w:'Světlo se rozdělí mezi sousední fotonásobiče a z poměru jejich signálů se spočítá poloha. Součet signálů je úměrný energii.'},
  {q:'V čem je hlavní princip přímé konverze u CZT?',o:['Foton se nejdřív změní na světlo, to se zesílí a převede na proud','Foton v polovodiči vytvoří páry elektron–díra, které elektrické pole odvede k elektrodám jako elektrický impuls','Kolimátor se nahradí magnetem','Detektor pracuje bez fotonů'],a:1,w:'Vynechá se světelný mezistupeň. Foton 140 keV vytvoří řádově desítky tisíc nosičů náboje, proto má CZT lepší energetické rozlišení.'},
  {q:'Proč mají CZT kamery lepší energetické rozlišení než NaI(Tl) s fotonásobiči?',o:['Mají silnější kolimátor','Signál je tvořen mnohem větším počtem nosičů (desítky tisíc párů místo stovek fotoelektronů) a řetěz má méně ztrátových kroků','Mají větší krystaly','Pracují při vyšší teplotě'],a:1,w:'Statistické kolísání je úměrné 1/√N. Více nosičů znamená menší relativní kolísání. Skutečné rozlišení CZT je ale omezeno sběrem náboje (např. zachytáváním děr).'}
 ]
};

CONTENT.pet[2]={
 blocks:[
 `<h3>Co musí umět detektor pro 511 keV</h3>
  <p>Princip je stejný jako ve SPECT: <b>scintilační krystal</b> převede energii fotonu na světlo a <b>fotodetektor</b> světlo na elektrický signál. Požadavky jsou ale přísnější, protože fotony mají 511 keV (pronikavější než 140 keV) a hledá se <b>dvojice</b> fotonů zachycená současně. Krystal musí:</p>
  <ul>
  <li><b>Zastavit foton 511 keV.</b> Potřebuje vysokou hustotu a vysoké protonové číslo (aby převládal fotoefekt) a dostatečnou tloušťku.</li>
  <li><b>Mít krátký dosvit.</b> Dvojice se pozná podle shody v čase v řádu nanosekund. Čím rychleji krystal světlo vyzáří, tím přesněji se určí čas příletu a tím užší může být koincidenční okno. Krátký dosvit také brání překrývání signálů při vysoké četnosti.</li>
  <li><b>Vyzářit dost světla.</b> Čím víc světelných fotonů, tím přesnější je určení energie, polohy i času.</li>
  <li>Být mechanicky odolný, nehygroskopický a dát se opracovat na úzké hranoly.</li>
  </ul>
  <div class="tbl"><table>
  <thead><tr><th>Krystal</th><th>Hustota [g/cm³]</th><th>Délka útlumu 511 keV [mm]</th><th>Světelný výtěžek [fot./keV]</th><th>Dosvit [ns]</th><th>Energ. rozlišení [%]</th></tr></thead>
  <tbody>
  <tr><td>NaI(Tl)</td><td>3,67</td><td>29,1</td><td>38</td><td>230</td><td>7,8</td></tr>
  <tr><td>BGO</td><td>7,13</td><td>10,4</td><td>9</td><td>300</td><td>12,0</td></tr>
  <tr><td>LSO / LYSO</td><td>7,40</td><td>11,4</td><td>30</td><td>40</td><td>10,0</td></tr>
  <tr><td>GSO</td><td>6,71</td><td>14,1</td><td>8</td><td>60</td><td>9,0</td></tr>
  </tbody></table></div>
  <p>Hodnoty jsou ze zdroje uvedeného dole. Energetické rozlišení v klinických přístrojích se od těchto laboratorních hodnot liší.</p>
  <ul>
  <li><b>LSO / LYSO</b> (oxyortokřemičitan lutecia, případně s yttriem, aktivovaný ceriem) je dnes v klinických PET nejpoužívanější. Má vysokou hustotu, velký světelný výtěžek a hlavně <b>krátký dosvit 40 ns</b>, který dovolí přesné časování. Obsahuje přirozený izotop Lu-176, který způsobuje slabé vlastní pozadí.</li>
  <li><b>BGO</b> (germanát bismutitý) má nejkratší délku útlumu (nejlépe zastavuje), ale malý světelný výtěžek a pomalejší dosvit, proto je horší v časování.</li>
  <li><b>NaI(Tl)</b> má největší světelný výtěžek, ale foton 511 keV zastaví výrazně hůř a je pomalý.</li>
  </ul>
  <p>Podíl fotonů, které v krystalu o dané tloušťce interagují, je <b>1 − e<sup>−t/L</sup></b> (L je délka útlumu). Vyzkoušej:</p>`,
 {w:'stop',k:'pet',title:'Kolik fotonů 511 keV krystal zastaví',lead:'Vyber materiál a posuň tloušťku. Při koincidenci musí interagovat oba fotony, účinnost páru je tedy druhou mocninou.'},
 `<p>Typický krystal klinického PET je tenký hranol o průřezu zhruba 4 × 4 mm a <b>délce kolem 20 mm</b>. Průřez určuje prostorové rozlišení, délka zastavení fotonu. U LYSO 20 mm zastaví zhruba 80 % fotonů, pro dvojici platí zhruba 2/3.</p>
  <h3>Jak je detektor postaven: blokový detektor</h3>
  <p>PET má kolem pacienta <b>desítky tisíc</b> krystalů o průřezu pár milimetrů. Každý krystal by neměl svůj fotodetektor, bylo by to nákladné a nevešlo by se to. Proto se krystaly spojují do <b>bloků</b> (například 8 × 8 krystalů) čtených jen <b>čtyřmi fotodetektory</b>. Klikni na vrstvu:</p>`,
 {w:'stack',k:'pet',title:'Řez blokem a prstenec detektorů',lead:'Vyber vrstvu bloku.'},
 `<p>Jak se pozná, <b>který krystal</b> v bloku foton zasáhl? Světlo z krystalu se ve světlovodu mezi čtyři fotodetektory rozdělí podle polohy: krystal v rohu rozsvítí jeden detektor hodně a ostatní málo. Poloha vychází z poměru signálů, podobně jako u Angerovy logiky. Výsledek se při kalibraci přiřadí konkrétním krystalům pomocí <b>mapy</b> (rozptyl „flood“ histogramu). Zkus to:</p>`,
 {w:'locate',k:'pet',title:'Blok 8 × 8 krystalů čtený čtyřmi fotodetektory',lead:'Klikni na krystal. Šedé body jsou kalibrační mapa (kde se každý krystal při dobrém signálu zobrazí). Pak vyšli 100 událostí a sleduj, kolik se jich zařadí do správného krystalu při různém počtu fotoelektronů.'},
 `<p>Při malém počtu fotoelektronů se body mapy překrývají a část událostí se přiřadí sousednímu krystalu. To je důvod, proč je velký světelný výtěžek (LYSO) výhodný a proč se světlovod i fotodetektory navrhují tak, aby se zachytilo co nejvíc světla.</p>
  <h3>Fotodetektory: fotonásobič a SiPM</h3>
  <p>Řetěz fotonásobiče je stejný jako ve SPECT (fotokatoda, dynody, anoda). Pro 511 keV se hodnotí hlavně <b>rychlost a množství světla</b>. Vyzkoušej, kolik fotoelektronů vznikne v jednotlivých krystalech:</p>`,
 {w:'pmt',k:'pet',title:'Řetěz fotonásobiče',lead:'Vyber krystal a nastav počet dynod a napětí. Porovnej počet fotoelektronů a statistický limit rozlišení.'},
 `<p>Novější přístroje používají místo fotonásobičů <b>SiPM</b> (křemíkový fotonásobič). Je to křemíková matice tisíců mikrobuněk, z nichž každá při dopadu světelného fotonu krátce „vystřelí“ (lavinový průraz). Součet výstřelů je úměrný počtu fotonů.</p>
  <div class="tbl"><table>
  <thead><tr><th></th><th>Fotonásobič (PMT)</th><th>SiPM</th></tr></thead>
  <tbody>
  <tr><td>Princip</td><td>vakuová trubice, fotokatoda a dynody</td><td>křemíková matice mikrobuněk</td></tr>
  <tr><td>Napětí</td><td>stovky až kolem 1000 V</td><td>desítky V</td></tr>
  <tr><td>Rozměr</td><td>velký objem, omezuje prostorové rozlišení</td><td>kompaktní, malé mezery mezi pixely</td></tr>
  <tr><td>Magnetické pole</td><td>citlivý</td><td>necitlivý, proto vhodný pro PET/MR</td></tr>
  <tr><td>Časování</td><td>větší rozptyl doby průletu elektronů</td><td>umožňuje lepší TOF u moderních systémů</td></tr>
  <tr><td>Nevýhody</td><td>objem, křehkost, vysoké napětí</td><td>závislost zesílení na teplotě, temné pulzy</td></tr>
  </tbody></table></div>
  <div class="key"><p><b>Proč se přechází na SiPM.</b> Je menší, a krystaly lze proto číst po jednom, což zlepší určení polohy. Dovoluje přesnější časování, a tím TOF (téma Lokalizace zdroje). A funguje v magnetickém poli, takže umožní PET/MR. Za to je třeba hlídat teplotu a temné pulzy.</p></div>
  <h3>Existuje varianta s přímou konverzí?</h3>
  <p>Ano, polovodiče (CZT, CdTe) převádějí foton rovnou na náboj, bez světelného kroku, a mají dobré energetické rozlišení a polohu. Pro celotělový klinický PET se ale nepoužívají. Foton 511 keV je třeba zastavit v dostatečně tlustém detektoru a polovodič má nižší hustotu a protonové číslo než LYSO. Sběr náboje je také pomalejší než záblesk scintilátoru, a PET přitom potřebuje časování v řádu stovek pikosekund. Polovodičové PET detektory existují hlavně jako vývojové a specializované systémy.</p>`,
 {gloss:1}
 ],
 src:`Tabulka scintilátorů (hustota, délka útlumu pro 511 keV, světelný výtěžek, dosvit, energetické rozlišení): <a href="https://socr.umich.edu/BPAD1/BPAD1_notes/BPAD1_Chap06_NuclearMedicine_PET_SPECT.html" target="_blank" rel="noopener">SOCR, učební poznámky k PET a SPECT, Table 6</a>. Srovnání SiPM a fotonásobičů (velikost, necitlivost na magnetické pole, časování, teplotní závislost): <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9308856" target="_blank" rel="noopener">Silicon photomultiplier signal readout and multiplexing techniques for PET: a review</a>. Blokový detektor se čtyřmi fotonásobiči a kódovaným světlovodem: <a href="https://www.osti.gov/biblio/7031539" target="_blank" rel="noopener">A new multi-crystal two dimensional detector block for PET (OSTI)</a>. Rozměry krystalů, zesílení a kvantová účinnost fotonásobiče a poznámky o polovodičových PET detektorech jsou obecně známé orientační údaje, které je třeba doložit v učebnici.`,
 quiz:[
  {q:'Proč je v PET LYSO dnes častější než BGO?',o:['LYSO má vyšší hustotu než BGO','LYSO má kratší dosvit (≈ 40 ns) a větší světelný výtěžek, což umožňuje přesnější časování a užší koincidenční okno','LYSO zastaví 511 keV mnohem lépe než BGO','LYSO neobsahuje žádné radioaktivní izotopy'],a:1,w:'BGO zastaví foton o něco lépe, ale je pomalejší a vyzáří méně světla. LYSO má dosvit 40 ns proti 300 ns a světelný výtěžek ≈ 30 proti ≈ 9 fotonů/keV.'},
  {q:'Proč je u PET důležitý krátký dosvit krystalu?',o:['Aby krystal zůstal chladnější','Aby se dvojice fotonů poznala podle přesné shody v čase a bylo možné zkrátit koincidenční okno (TOF)','Aby měl krystal větší hustotu','Aby se dalo použít méně krystalů'],a:1,w:'Dvojice se pozná podle současnosti zásahu. Rychlejší krystal dává přesnější čas a menší pravděpodobnost náhodných koincidencí.'},
  {q:'Jak se mění podíl fotonů zastavených v krystalu s tloušťkou?',o:['Roste lineárně až do 100 %','Roste exponenciálně pomalu k 100 %: 1 − e^(−t/L)','Je stejný pro každou tloušťku','Klesá s tloušťkou'],a:1,w:'Fotony se zeslabují exponenciálně. Každá další vrstva zastaví jen část toho, co zbylo.'},
  {q:'Proč se krystaly v PET spojují do bloků čtených čtyřmi fotodetektory?',o:['Aby krystal dostal víc záření','Aby nebylo potřeba tisíce fotodetektorů (jeden na krystal) a poloha se určila z poměru signálů čtyř','Aby se dosvit prodloužil','Aby se zvýšila energie fotonů'],a:1,w:'Jeden fotodetektor na každý úzký krystal by byl drahý a nevešel by se. V bloku se světlo mezi čtyři detektory dělí a z poměru signálů se určí zasažený krystal.'},
  {q:'Proč se při malém počtu fotoelektronů zhorší určení zasaženého krystalu v bloku?',o:['Signály čtyř fotodetektorů jsou šumem natolik rozptýlené, že se oblasti sousedních krystalů překrývají','Krystaly se zahřívají','Fotony se odrážejí od krystalů','Blok pak odmítne měřit'],a:0,w:'Statistický šum polohy je úměrný 1/√N. S menším počtem fotoelektronů se body mapy překrývají a část událostí se přiřadí sousednímu krystalu.'},
  {q:'Co je z hlediska PET hlavní výhodou SiPM oproti fotonásobiči?',o:['SiPM vyžaduje vyšší napětí','SiPM je kompaktní, necitlivý na magnetické pole (PET/MR) a umožňuje přesnější časování','SiPM nepotřebuje krystal','SiPM není závislý na teplotě'],a:1,w:'SiPM je malý, funguje v magnetickém poli a podporuje lepší TOF. Nevýhodou je teplotní závislost zesílení a temné pulzy.'},
  {q:'Proč se přímá konverze (CZT) nepoužívá v celotělových klinických PET?',o:['Neumí měřit energii','Nelze vyrobit žádný polovodič','Pro 511 keV je třeba hustý a rychlý detektor; polovodič zastaví foton hůř než LYSO a sběr náboje je pomalejší než scintilační záblesk','Polovodič nereaguje na záření gama'],a:2,w:'PET potřebuje zastavit pronikavé fotony 511 keV a přesně určit čas příletu. LYSO s fotodetektorem to zvládá lépe.'}
 ]
};

CONTENT.spect[3]={
 blocks:[
 `<h3>Co je třeba zjistit</h3>
  <p>Detektor změří jen to, <b>kde</b> foton dopadl a <b>jakou energii</b> měl. Zdroj ale může ležet kdekoli na přímce, ze které foton přiletěl, a foton se cestou mohl v těle rozptýlit a letět jiným směrem než původně. Aby šlo určit, odkud signál pochází, musí přístroj vyřešit tři věci:</p>
  <ol>
  <li><b>Odkud foton letěl (směr).</b> Zajišťuje <b>kolimátor</b>.</li>
  <li><b>Kde dopadl na detektor (poloha).</b> Zajišťují krystal, fotonásobiče a Angerova logika (téma Detekce).</li>
  <li><b>Zda letěl přímo ze zdroje.</b> Foton rozptýlený v těle ukazuje špatný směr. Pozná se podle <b>energie</b> a vyřadí se <b>energetickým oknem</b>.</li>
  </ol>
  <p>Hloubka zdroje se z jednoho pohledu určit nedá. Získá se až z pohledů pod mnoha úhly (tomografie, viz Úvod a téma Softwarový dopočet).</p>
  <h3>Kolimátor</h3>
  <p><b>Kolimátor</b> je deska z olova (nebo wolframu) se stovkami až tisíci úzkých otvorů, kterou kryje celý krystal. Foton, který letí ve směru otvoru, projde a dopadne na krystal. Foton letící šikmo narazí na přepážku (<b>septum</b>) a je pohlcen. Každý bod krystalu proto „vidí“ jen úzký sloupec těla před sebou a obraz je <b>projekcí</b> rozložení látky na rovinu.</p>
  <div class="tbl"><table>
  <thead><tr><th>Typ</th><th>Princip</th><th>Použití</th></tr></thead>
  <tbody>
  <tr><td>Paralelní otvory</td><td>otvory rovnoběžné, obraz ve skutečné velikosti</td><td>nejběžnější, většina vyšetření</td></tr>
  <tr><td>Pinhole</td><td>jeden malý otvor, obraz zvětšený a převrácený</td><td>malé orgány (např. štítná žláza), malá zvířata</td></tr>
  <tr><td>Konvergentní (fan-beam, cone-beam)</td><td>otvory míří do společného ohniska, obraz zvětšený</td><td>mozek, srdce: vyšší citlivost při stejném rozlišení, ale menší zorné pole</td></tr>
  <tr><td>Divergentní</td><td>otvory se rozbíhají, obraz zmenšený</td><td>velký orgán na malém detektoru, horší rozlišení</td></tr>
  </tbody></table></div>
  <h3>Rozlišení a citlivost kolimátoru</h3>
  <p>Kolimátor je kompromis. Čím <b>užší a delší</b> otvory, tím ostřejší obraz, ale tím víc fotonů přepážky zachytí. Pro paralelní otvory platí (d je průměr otvoru, L jeho délka, t tloušťka septa, b vzdálenost zdroje od kolimátoru, K ≈ 0,26 pro šestiúhelníkové otvory):</p>
  <ul>
  <li>rozlišení: <b>R<sub>koll</sub> ≈ d · (L + b) / L</b></li>
  <li>citlivost (podíl fotonů, které projdou): <b>g ≈ (K · d/L · d/(d+t))²</b></li>
  </ul>
  <p>Výsledné rozlišení soustavy je R<sub>sys</sub> = √(R<sub>koll</sub>² + R<sub>int</sub>²), kde R<sub>int</sub> je vnitřní rozlišení detektoru. Z prvního vzorce plyne důležitý závěr: <b>rozlišení se zhoršuje lineárně se vzdáleností zdroje od kolimátoru</b>, proto se kamera přibližuje co nejblíž k pacientovi. Zkus to:</p>`,
 {w:'colres',title:'Kolimátor: rozlišení podle vzdálenosti',lead:'Vyber typ kolimátoru a měň vzdálenost zdroje. Všimni si, že větší otvory dají mnohem vyšší citlivost, ale horší rozlišení.'},
 `<div class="key"><p><b>Kolimátor pro každou energii.</b> Přepážky musí být dost silné, aby jimi foton neprošel z jednoho otvoru do druhého (<b>septální penetrace</b>). Pro záření kolem 140 keV (Tc-99m) stačí tenká septa (zhruba 0,2 mm), pro vyšší energie (např. I-131, 364 keV) jsou potřeba tlustší, a ta při stejném rozlišení znamenají nižší citlivost. Proto se kolimátory dělí na nízkoenergetické, středně a vysokoenergetické.</p></div>
  <h3>Proč se foton musí rozpoznat podle energie: Comptonův rozptyl</h3>
  <p>Část fotonů se v těle před opuštěním rozptýlí (Comptonův rozptyl) a změní směr. Takový foton přichází z jiného místa, než kde je zdroj, a kdyby se započítal, rozmazal by obraz a snížil kontrast. Při rozptylu ale foton <b>ztratí část energie</b>, a to tím víc, čím větší je úhel rozptylu θ:</p>
  <p><b>E′ = E / (1 + (E / 511 keV) · (1 − cos θ))</b></p>
  <p>Detektor energii měří, takže může rozptýlené fotony vyřadit: do obrazu se zapíše jen událost, jejíž energie leží v <b>energetickém okně</b> kolem fotopíku. Pro Tc-99m se typicky používá okno 140 keV ± 10 %. Vyzkoušej, jaký rozptyl okno ještě propustí:</p>`,
 {w:'compton',k:'spect',title:'Energie po rozptylu a energetické okno',lead:'Posuň úhel rozptylu. Pokud energie po rozptylu leží nad dolní hranou okna, foton se započítá jako nerozptýlený.'},
 `<p>Z grafu je vidět, že <b>rozptyl pod malým úhlem okno neodfiltruje</b>: ztráta energie je menší než šířka okna. Zúžením okna se propustí méně rozptýlených fotonů, ale okno nelze zúžit libovolně, protože fotopík má kvůli omezenému energetickému rozlišení konečnou šířku.</p>
  <h3>Spektrum a energetické okno</h3>
  <p>Rozložení naměřených energií se nazývá <b>spektrum</b>. Má tyto části:</p>
  <ul>
  <li><b>Fotopík</b>: fotony, které v krystalu odevzdaly celou energii (140 keV). Jeho šířka je dána energetickým rozlišením detektoru (statistika světla, téma Detekce).</li>
  <li><b>Rozptýlené fotony</b>: fotony, které se v těle rozptýlily. Mají nižší energii, ale ty s malým úhlem rozptylu leží těsně pod fotopíkem a částečně do něj zasahují.</li>
  </ul>
  <p>Energetické rozlišení se tu přímo projeví. Užší fotopík (CZT) dovolí užší okno a vyřadí víc rozptýlených fotonů při stejném zachycení primárních. Zkus to:</p>`,
 {w:'spectrum',k:'spect',title:'Spektrum, fotopík a okno',lead:'Porovnej NaI(Tl) a CZT. Zúžením okna ubývá rozptýlených fotonů, ale u širokého fotopíku i primárních.'},
 `<h3>Z čeho se skládá přístroj a co dělá</h3>
  <ul>
  <li><b>Kolimátor</b> určí směr. Vyměňuje se podle energie nuklidu a úlohy (rozlišení nebo citlivost).</li>
  <li><b>Krystal, světlovod, fotonásobiče a Angerova logika</b> určí polohu dopadu a energii.</li>
  <li><b>Analyzátor amplitud</b> porovná energii události s nastaveným oknem a vyřadí rozptýlené fotony.</li>
  <li><b>Korekční mapy</b> (linearity, energie, uniformity) vyrovnají nerovnoměrnosti kamery.</li>
  <li><b>Stínění</b> krystalu zezadu a z boků zabraňuje, aby se zaznamenávalo záření z okolí.</li>
  <li><b>Gantry</b> otáčí detektory kolem pacienta a drží je blízko jeho těla, aby bylo rozlišení co nejlepší.</li>
  </ul>
  <h3>Jak lokalizaci zlepšit</h3>
  <ul>
  <li>Kameru držet <b>co nejblíž</b> pacientovi (tvarová orbita).</li>
  <li>Zvolit <b>kolimátor</b> odpovídající energii a úloze.</li>
  <li>Použít detektor s <b>dobrým energetickým rozlišením</b> (užší okno, méně rozptylu).</li>
  <li>Nasnímat <b>dost událostí</b> (déle nebo s větší aktivitou), aby byl menší statistický šum.</li>
  <li>Více detektorů zvyšuje celkovou citlivost bez ztráty rozlišení.</li>
  <li>Korekce rozptylu a útlumu při rekonstrukci (téma Softwarový dopočet).</li>
  </ul>`,
 {gloss:1}
 ],
 src:`Vzorce pro rozlišení a citlivost kolimátoru, typické rozměry (L = 24 mm, t = 0,2 mm, průměr otvoru 1,11 / 1,40 / 2,54 mm), energetické okno 140 keV ± 10 % a mezní úhly rozptylu pro okno ±15 % (≈ 69° při 140 keV): <a href="https://socr.umich.edu/BPAD1/BPAD1_notes/BPAD1_Chap06_NuclearMedicine_PET_SPECT.html" target="_blank" rel="noopener">SOCR, učební poznámky k PET a SPECT, kap. 6.4–6.5</a>. Rozdělení kolimátorů podle tvaru a energie a vnitřní rozlišení 3,5 mm jsou obecně známé orientační údaje, které je třeba doložit v učebnici.`,
